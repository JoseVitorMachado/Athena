components:
  schemas:
    RequisitoGestao:
      type: object
      properties:
        requisitoId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        projetoId:
          type: string
          example: 22222222-2222-4222-8222-222222222222
          format: uuid
        codigo:
          type: string
          example: REQ-42
          pattern: ^REQ-[0-9]+$
        titulo:
          type: string
          example: Exportar documento de requisitos.
        situacao:
          $ref: '#/components/schemas/SituacaoRequisito'
        versaoEmEdicao:
          type: integer
          example: 4
          minimum: 1
        versaoId:
          type: string
          example: 33333333-3333-4333-8333-333333333333
          format: uuid
        estadoVersao:
          $ref: '#/components/schemas/EstadoVersao'
        loteId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        pendenciasAbertas:
          type: integer
          example: 2
          minimum: 0
        atualizadoEm:
          type: string
          example: '2026-10-21T15:00:00Z'
          format: date-time
          pattern: Z$
        _links:
          $ref: '#/components/schemas/Links'
        _actions:
          $ref: '#/components/schemas/Actions'
        avisos:
          type: array
          items:
            type: string
            example: Revisões indisponível.
          example: []
      additionalProperties: false
      required:
        - requisitoId
        - projetoId
        - codigo
        - titulo
        - situacao
        - atualizadoEm
        - _links
        - _actions
        - avisos
      example:
        requisitoId: 11111111-1111-4111-8111-111111111111
        projetoId: 22222222-2222-4222-8222-222222222222
        codigo: REQ-42
        titulo: Exportar documento de requisitos.
        situacao: ATIVO
        atualizadoEm: '2026-10-21T15:00:00Z'
        _links: {}
        _actions: {}
        avisos: []
    SituacaoRequisito:
      type: string
      example: ATIVO
      enum:
        - ATIVO
        - CANCELADO
    EstadoVersao:
      type: string
      example: RASCUNHO
      enum:
        - RASCUNHO
        - EM_SUBMISSAO
        - AGUARDANDO_REVISAO
        - APROVADA
        - PUBLICADA
    Versao:
      type: object
      properties:
        versaoId:
          type: string
          example: 33333333-3333-4333-8333-333333333333
          format: uuid
        requisitoId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        numero:
          type: integer
          example: 4
          minimum: 1
        estadoVersao:
          $ref: '#/components/schemas/EstadoVersao'
        titulo:
          type: string
          example: Exportar documento de requisitos.
        conteudo:
          type: string
          example: O sistema deve permitir exportar o documento.
        criteriosAceite:
          type: array
          items:
            type: string
            example: Exportação preserva requisitos.
          example:
            - Exportação preserva requisitos.
        hashConteudo:
          type: string
          example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          pattern: ^[a-f0-9]{64}$
        atualizadoEm:
          type: string
          example: '2026-10-21T15:00:00Z'
          format: date-time
          pattern: Z$
      additionalProperties: false
      required:
        - versaoId
        - requisitoId
        - numero
        - estadoVersao
        - titulo
        - conteudo
        - criteriosAceite
        - hashConteudo
        - atualizadoEm
      example:
        versaoId: 33333333-3333-4333-8333-333333333333
        requisitoId: 11111111-1111-4111-8111-111111111111
        numero: 4
        estadoVersao: RASCUNHO
        titulo: Exportar documento de requisitos.
        conteudo: O sistema deve permitir exportar o documento.
        criteriosAceite:
          - Exportação preserva requisitos.
        hashConteudo: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        atualizadoEm: '2026-10-21T15:00:00Z'
    Requisito:
      type: object
      properties:
        requisitoId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        projetoId:
          type: string
          example: 22222222-2222-4222-8222-222222222222
          format: uuid
        codigo:
          type: string
          example: REQ-42
          pattern: ^REQ-[0-9]+$
        documentoId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        epicoId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        responsavelId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        tipo:
          type: string
          example: FUNCIONAL
        titulo:
          type: string
          example: Exportar documento de requisitos.
        situacao:
          $ref: '#/components/schemas/SituacaoRequisito'
        candidata:
          $ref: '#/components/schemas/Versao'
        versaoPublicadaId:
          type: string
          example: 33333333-3333-4333-8333-333333333333
          format: uuid
        atualizadoEm:
          type: string
          example: '2026-10-21T15:00:00Z'
          format: date-time
          pattern: Z$
      additionalProperties: false
      required:
        - requisitoId
        - projetoId
        - codigo
        - titulo
        - situacao
        - atualizadoEm
      example:
        requisitoId: 11111111-1111-4111-8111-111111111111
        projetoId: 22222222-2222-4222-8222-222222222222
        codigo: REQ-42
        titulo: Exportar documento de requisitos.
        situacao: ATIVO
        atualizadoEm: '2026-10-21T15:00:00Z'
