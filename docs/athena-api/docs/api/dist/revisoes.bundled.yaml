    ConfirmacaoHumanaEntrada:
      type: object
      properties:
        versaoId:
          type: string
          example: 33333333-3333-4333-8333-333333333333
          format: uuid
        hashAcao:
          type: string
          example: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          pattern: ^[a-f0-9]{64}$
        confirmacao:
          type: boolean
          const: true
          example: true
      additionalProperties: false
      required:
        - versaoId
        - hashAcao
        - confirmacao
      example:
        versaoId: 33333333-3333-4333-8333-333333333333
        hashAcao: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        confirmacao: true
    ConfirmacaoHumana:
      type: object
      properties:
        confirmacaoId:
          type: string
