# O BFF não tem estado nem banco: só precisa saber onde estão os serviços de
# domínio. Os endereços vêm de variáveis de ambiente (compose ou ConfigMap).

server:
  # Redirecionamentos relativos (Location sem host): atrás do Gateway, do nginx
  # dos clientes ou do Ingress, o navegador nunca recebe o nome interno do container.
  tomcat:
    use-relative-redirects: true
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: bff-livro
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PROJETOS_ACESSO_URL}/oauth2/jwks
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null

athena:
  servicos:
    projetos-acesso: ${PROJETOS_ACESSO_URL}
    requisitos: ${REQUISITOS_URL}
    rastreabilidade: ${RASTREABILIDADE_URL}
  http:
    timeout-conexao: ${HTTP_TIMEOUT_CONEXAO:2s}
    timeout-leitura: ${HTTP_TIMEOUT_LEITURA:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# O Gateway encaminha apenas os prefixos dos módulos; inclusive os recursos da
# interface e sua configuração precisam permanecer sob o mesmo prefixo.
springdoc:
  paths-to-match: /api/v1/livro/**
  api-docs:
    path: /api/v1/livro/docs/openapi.json
  swagger-ui:
    path: /api/v1/livro/docs/index.html
    url: /api/v1/livro/docs/openapi.json
    config-url: /api/v1/livro/docs/openapi.json/swagger-config
    disable-swagger-default-url: true
    oauth2-redirect-url: /api/v1/livro/docs/swagger-ui/oauth2-redirect.html
    try-it-out-enabled: true
    persist-authorization: true
    with-credentials: true
