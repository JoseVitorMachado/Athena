        '503':
          $ref: '#/components/responses/Erro503'
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de negócio seguem o livro e lacunas usam x-decidir.
components:
  schemas:
    VersaoUtilizada:
      type: object
      properties:
        requisitoId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        versaoId:
          type: string
          example: 33333333-3333-4333-8333-333333333333
          format: uuid
        hashConteudo:
          type: string
          example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      additionalProperties: false
      required:
        - requisitoId
        - versaoId
        - hashConteudo
      example:
        requisitoId: 11111111-1111-4111-8111-111111111111
        versaoId: 33333333-3333-4333-8333-333333333333
        hashConteudo: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    Evidencia:
      type: object
      properties:
        origemId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        versaoId:
          type: string
          example: 33333333-3333-4333-8333-333333333333
          format: uuid
        trecho:
          type: string
          example: O documento deve ser exportável.
        referencia:
          type: string
          example: /api/v1/gestao/projetos/22222222-2222-4222-8222-222222222222/requisitos/11111111-1111-4111-8111-111111111111
          format: uri-reference
      additionalProperties: false
      required:
        - origemId
        - versaoId
        - trecho
        - referencia
      example:
        origemId: 11111111-1111-4111-8111-111111111111
        versaoId: 33333333-3333-4333-8333-333333333333
        trecho: O documento deve ser exportável.
        referencia: /api/v1/gestao/projetos/22222222-2222-4222-8222-222222222222/requisitos/11111111-1111-4111-8111-111111111111
    Sugestao:
      type: object
      properties:
        sugestaoId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        tipo:
          type: string
          example: RELACAO
        requisitoAnalisadoId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        alvos:
          type: array
          items:
            type: string
            example: 11111111-1111-4111-8111-111111111111
            format: uuid
          example:
            - 33333333-3333-4333-8333-333333333333
        versoesUtilizadas:
          type: array
          items:
            $ref: '#/components/schemas/VersaoUtilizada'
          example: []
        evidencias:
          type: array
          items:
            $ref: '#/components/schemas/Evidencia'
          example: []
        justificativa:
          type: string
          example: A alteração afeta requisito relacionado.
        estadoValidacao:
          type: string
          example: PENDENTE
      additionalProperties: false
      required:
        - sugestaoId
        - tipo
        - requisitoAnalisadoId
        - alvos
        - versoesUtilizadas
        - evidencias
        - justificativa
        - estadoValidacao
      example:
        sugestaoId: 11111111-1111-4111-8111-111111111111
        tipo: RELACAO
        requisitoAnalisadoId: 11111111-1111-4111-8111-111111111111
        alvos:
          - 33333333-3333-4333-8333-333333333333
        versoesUtilizadas: []
        evidencias: []
        justificativa: A alteração afeta requisito relacionado.
        estadoValidacao: PENDENTE
    AnaliseEntrada:
      type: object
      properties:
        requisitoId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        versaoId:
          type: string
          example: 33333333-3333-4333-8333-333333333333
          format: uuid
        objetivo:
          type: string
          example: Identificar impactos da alteração
      additionalProperties: false
      required:
        - requisitoId
        - versaoId
      example:
        requisitoId: 11111111-1111-4111-8111-111111111111
        versaoId: 33333333-3333-4333-8333-333333333333
    Analise:
      type: object
      properties:
        analiseId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        projetoId:
          type: string
          example: 22222222-2222-4222-8222-222222222222
          format: uuid
        status:
          type: string
          example: AGUARDANDO_AGENTE
        sugestoes:
          type: array
          items:
            $ref: '#/components/schemas/Sugestao'
          example: []
        atualizadoEm:
          type: string
          example: '2026-10-21T15:00:00Z'
          format: date-time
          pattern: Z$
      additionalProperties: false
      required:
        - analiseId
        - projetoId
        - status
        - sugestoes
        - atualizadoEm
      example:
        analiseId: 11111111-1111-4111-8111-111111111111
        projetoId: 22222222-2222-4222-8222-222222222222
        status: AGUARDANDO_AGENTE
        sugestoes: []
        atualizadoEm: '2026-10-21T15:00:00Z'
    AvaliacaoEntrada:
      type: object
      properties:
        avaliacao:
          type: string
          example: ACEITAR
        versoesUtilizadas:
          type: array
          items:
            $ref: '#/components/schemas/VersaoUtilizada'
          example: []
        justificativa:
          type: string
          example: Evidências conferidas
      additionalProperties: false
      required:
        - avaliacao
