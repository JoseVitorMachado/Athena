      x-papel-minimo: Editor
      x-escopo-mcp: athena:write
      x-projeto: projetoId
      x-decidir: Confirmar Idempotency-Key obrigatória na sincronização e catálogo completo de estados.
      x-proposta: true
      parameters:
      - $ref: ./_shared/components.yaml#/components/parameters/ProjetoId
      - $ref: ./_shared/components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SincronizacaoEntrada'
      responses:
        '202':
          description: Aceito; acompanhar Location; não indica conclusão (§6.2).
          headers:
            Location:
              $ref: ./_shared/components.yaml#/components/headers/Location
          content:
            application/json:
