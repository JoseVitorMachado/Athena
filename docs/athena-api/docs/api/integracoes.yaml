  /api/v1/projetos/{projetoId}/sincronizacoes:
    post:
      operationId: criarSincronizacao
      summary: Criar sincronizacao
      description: §6.10. Operação e intenção persistidas atomicamente; compara versão externa e revisão local.
        Timeout consulta/reconcilia antes de repetir; sem prova do efeito fica RESULTADO_DESCONHECIDO com resolução
        humana e sem nova criação automática. 429 externo respeita Retry-After. §6.10. Credenciais só writeOnly
        no backend, nunca retornadas. Google prioriza drive.file com seleção explícita; OpenProject com mínimo acesso
        ao projeto. GitHub MVP somente vínculos. Importação explícita entra como rascunho/proposta, jamais sobrescreve
        publicada. Fluxo de autorização de conectores não definido.
      tags:
