        - submissoes
      x-papel-minimo: Editor
      x-escopo-mcp: athena:write
      x-projeto: projetoId
      parameters:
        - $ref: '#/components/parameters/ProjetoId'
        - $ref: '#/components/parameters/RequisitoId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissaoEntrada'
      responses:
        '202':
          description: Aceito; acompanhar Location; não indica conclusão (§6.2).
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submissao'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          description: Conflitos de negócio, conforme §§5.2–5.4 e 6.9. Códigos propostos estão em PROPOSTAS.md.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                submissao-ativa:
                  value:
                    type: urn:athena:problema:submissao-ativa
                    title: Conflito com estado atual
                    status: 409
                    detail: 'Conflito: submissao ativa.'
                    instance: /api/v1/gestao/projetos/22222222-2222-4222-8222-222222222222
                    codigo: SUBMISSAO_ATIVA
                    traceId: a3d9b24f670c48bca701d5f893ed45af
