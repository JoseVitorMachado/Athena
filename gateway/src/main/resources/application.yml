# Os destinos das rotas vêm de variáveis de ambiente (compose ou ConfigMap).

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            # Sem pool, cada requisição abre uma conexão nova com o destino. O
            # Kubernetes balanceia por conexão, então só assim as réplicas de um
            # BFF escalado recebem tráfego de forma distribuída.
            pool:
              type: ${GATEWAY_HTTP_POOL:disabled}
            connect-timeout: 2000
            response-timeout: 30s

athena:
  rotas:
    bff-gestao: ${BFF_GESTAO_URL}
    bff-livro: ${BFF_LIVRO_URL}
    impacto-mcp: ${IMPACTO_MCP_URL}
    projetos-acesso: ${PROJETOS_ACESSO_URL}
  # Origens extras aceitas em renovação e logout, separadas por vírgula. A origem
  # do próprio Host já é aceita (acesso direto e Ingress); aqui entram os clientes
  # servidos em outra porta, como no compose (livro §7.3: lista configurada, sem curinga).
  origens-permitidas: ${ATHENA_ORIGENS_PERMITIDAS:}

# O Actuator fica em outra porta, que não é publicada nem roteada: endpoints
# técnicos não saem pela entrada pública (livro §6.1).
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only
    health:
      show-details: always
      probes:
        enabled: true
