  /api/v1/projetos/{projetoId}/analises/{analiseId}/sugestoes:
    post:
      operationId: criarSugestaoAnalise
      summary: Criar sugestao analise
      description: §§6.11, 7.4–7.5. Proposta de rota de registro da saída externa não confiável; valida esquema, versões, evidências e acesso, sem criar relação oficial. Escopo athena:write e papel não substituem avaliação.
      tags:
        - sugestoes
      x-papel-minimo: Editor
      x-escopo-mcp: athena:write
      x-projeto: projetoId
      x-decidir: Confirmar fluxo/identificador para registrar sugestões do agente e papel de Repórter versus Editor.
      x-proposta: true
      parameters:
        - $ref: '#/components/parameters/ProjetoId'
        - name: analiseId
          in: path
          required: true
          description: UUID do recurso (§5.1).
          schema:
            type: string
            example: 11111111-1111-4111-8111-111111111111
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Sugestao'
      responses:
        '201':
          description: Criação síncrona (§6.2).
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugestao'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
