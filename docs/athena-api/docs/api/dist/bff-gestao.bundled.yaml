    description: Repasse de revisoes
  - name: workspaces
    description: Repasse de projetos-acesso
  - name: projetos
    description: Repasse de projetos-acesso
  - name: exclusoes
    description: Repasse de projetos-acesso
  - name: membros
    description: Repasse de projetos-acesso
