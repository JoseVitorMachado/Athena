  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT RS256
      description: §7.1–7.2. RS256, kid/JWKS; validar iss, aud, exp e sessão/autorização atual a cada chamada. Escopos só se aplicam à delegação; x-escopo-mcp declara o mapeamento.
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT RS256
      description: §7.1. Identidade de serviço ou token trocado, aud igual ao serviço chamado; preserva usuário, projeto e delegação, reduz escopos. Nunca repassar token MCP bruto.
    cookieRefresh:
      type: apiKey
      in: cookie
      name: athenaRefresh
      description: §7.2–7.3. Nome proposto; Secure, HttpOnly, SameSite=Lax, sem Domain, Path=/api/v1/autenticacao; rotação e validade absoluta da família.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: §7.3. Nome proposto. Token vinculado à sessão; validar também Origin.
    oauthClient:
      type: http
      scheme: basic
      description: Autenticação de cliente confidencial OAuth; método final depende da compatibilidade §7.1. Cliente público usa client_id e PKCE S256.
  parameters:
    ProjetoId:
      name: projetoId
      in: path
      required: true
      description: UUID estável (§5.1).
      schema:
        type: string
        example: 22222222-2222-4222-8222-222222222222
        format: uuid
    Page:
      name: page
      in: query
      description: Página inicial zero (§6.2).
      schema:
        type: integer
        example: 0
        default: 0
        minimum: 0
    Size:
      name: size
      in: query
      description: Quantidade por página (§6.2).
      schema:
        type: integer
        example: 20
        default: 20
        minimum: 1
        maximum: 100
    Sort:
      name: sort
      in: query
      description: '§6.2: id é desempate estável; valor fora do enum retorna 400. Operações especializam o enum.'
      schema:
        type: string
        example: atualizadoEm,desc
        default: atualizadoEm,desc
        enum:
          - atualizadoEm,desc
          - atualizadoEm,asc
          - id,asc
          - id,desc
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: '§6.3. Ordem: autenticar; verificar acesso atual; consultar chave no escopo usuário/projeto/operação e comparar pedido; repetição idêntica recupera resultado/acompanhamento por 24 h sem reavaliar If-Match; pedido divergente retorna 409. Só operação nova valida presença/valor de If-Match, quando exigido. Reserva, efeito e resultado são transacionais.'
      schema:
        type: string
        example: tentativa-20261021-001
        minLength: 1
  responses:
    Erro400:
      description: Requisição inválida (§6.1–6.3 e §7).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:athena:problema:requisicao-invalida
            title: Requisição inválida
            status: 400
            detail: Requisição inválida.
            instance: /api/v1/gestao/projetos/22222222-2222-4222-8222-222222222222
            codigo: REQUISICAO_INVALIDA
            traceId: a3d9b24f670c48bca701d5f893ed45af
    Erro401:
      description: Credencial ou sessão inválida (§6.1–6.3 e §7).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:athena:problema:nao-autenticado
            title: Credencial ou sessão inválida
            status: 401
            detail: Credencial ou sessão inválida.
            instance: /api/v1/gestao/projetos/22222222-2222-4222-8222-222222222222
            codigo: NAO_AUTENTICADO
            traceId: a3d9b24f670c48bca701d5f893ed45af
    Erro403:
      description: Acesso negado (§6.1–6.3 e §7).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:athena:problema:acesso-negado
            title: Acesso negado
            status: 403
            detail: Acesso negado.
            instance: /api/v1/gestao/projetos/22222222-2222-4222-8222-222222222222
            codigo: ACESSO_NEGADO
            traceId: a3d9b24f670c48bca701d5f893ed45af
    Erro404:
      description: Recurso não encontrado (§6.1–6.3 e §7).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:athena:problema:nao-encontrado
            title: Recurso não encontrado
            status: 404
            detail: Recurso não encontrado.
            instance: /api/v1/gestao/projetos/22222222-2222-4222-8222-222222222222
            codigo: NAO_ENCONTRADO
            traceId: a3d9b24f670c48bca701d5f893ed45af
    Erro409:
      description: Conflito com estado atual (§6.1–6.3 e §7).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:athena:problema:conflito
            title: Conflito com estado atual
            status: 409
            detail: Conflito com estado atual.
            instance: /api/v1/gestao/projetos/22222222-2222-4222-8222-222222222222
            codigo: CONFLITO
            traceId: a3d9b24f670c48bca701d5f893ed45af
    Erro429:
      description: Limite de requisições excedido (§6.1–6.3 e §7).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:athena:problema:limite-excedido
            title: Limite de requisições excedido
            status: 429
            detail: Limite de requisições excedido.
            instance: /api/v1/gestao/projetos/22222222-2222-4222-8222-222222222222
            codigo: LIMITE_EXCEDIDO
            traceId: a3d9b24f670c48bca701d5f893ed45af
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    Erro503:
      description: Serviço indisponível (§6.1–6.3 e §7).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:athena:problema:servico-indisponivel
            title: Serviço indisponível
            status: 503
            detail: Serviço indisponível.
            instance: /api/v1/gestao/projetos/22222222-2222-4222-8222-222222222222
            codigo: SERVICO_INDISPONIVEL
            traceId: a3d9b24f670c48bca701d5f893ed45af
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
  headers:
    RetryAfter:
      description: §6.1. Segundos até nova tentativa.
      schema:
        type: string
        example: '30'
    Location:
      description: §6.2. URI do recurso criado ou de acompanhamento.
      schema:
        type: string
        example: /api/v1/gestao/projetos/22222222-2222-4222-8222-222222222222
    ETag:
      description: §6.3. Revisão técnica forte do recurso.
      schema:
        type: string
        example: '"rev-7"'
