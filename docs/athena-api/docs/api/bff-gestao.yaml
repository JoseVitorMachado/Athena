paths:
  /api/v1/gestao/projetos/{projetoId}/requisitos:
    get:
      operationId: gestaoListarRequisitos
      summary: Listar requisitos
      description: 'Operação conforme §§5, 6.2–6.3 e 7.4. Revalidar acesso e estado no domínio proprietário. BFF
        Gestão (§4.2): consulta requisitos por troca de token, sem banco próprio; se domínio ou validação em Projetos
        e acesso falhar, retorna 503; não repete escrita automaticamente. Encaminha ETag, If-Match e Idempotency-Key.
        Location/_links externos usam /api/v1/gestao, sem revelar endereço interno.'
      tags:
      - requisitos
      x-papel-minimo: Leitor
      x-escopo-mcp: athena:read
      x-projeto: projetoId
      x-decidir: Qual catálogo de tipos de requisito?
      parameters:
      - $ref: ./_shared/components.yaml#/components/parameters/ProjetoId
      - $ref: ./_shared/components.yaml#/components/parameters/Page
      - $ref: ./_shared/components.yaml#/components/parameters/Size
      - $ref: ./_shared/components.yaml#/components/parameters/Sort
      - name: q
        in: query
        description: Filtro autorizado (§6.2); valor inválido retorna 400.
        schema:
          type: string
          example: exportar
      - name: situacao
        in: query
        description: Filtro autorizado (§6.2); valor inválido retorna 400.
        schema:
          $ref: ./_shared/components.yaml#/components/schemas/SituacaoRequisito
          default: ATIVO
      - name: estadoVersao
        in: query
        description: Filtro autorizado (§6.2); valor inválido retorna 400.
        schema:
          $ref: ./_shared/components.yaml#/components/schemas/EstadoVersao
      - name: tipo
        in: query
        description: Filtro autorizado (§6.2); valor inválido retorna 400.
        schema:
          type: string
          example: FUNCIONAL
      - name: epicoId
        in: query
        description: Filtro autorizado (§6.2); valor inválido retorna 400.
        schema:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      - name: responsavelId
        in: query
        description: Filtro autorizado (§6.2); valor inválido retorna 400.
        schema:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      responses:
        '200':
          description: Consulta ou alteração concluída (§6.2).
          content:
            application/json:
              schema:
                $ref: ./requisitos.yaml#/components/schemas/PaginaRequisitos
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
        '401':
          $ref: ./_shared/components.yaml#/components/responses/Erro401
        '403':
          $ref: ./_shared/components.yaml#/components/responses/Erro403
        '404':
          $ref: ./_shared/components.yaml#/components/responses/Erro404
        '409':
          $ref: ./_shared/components.yaml#/components/responses/Erro409
        '429':
          $ref: ./_shared/components.yaml#/components/responses/Erro429
        '503':
          $ref: ./_shared/components.yaml#/components/responses/Erro503
      security:
      - bearerJwt: []
      x-proposta: true
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
    post:
      operationId: gestaoCriarRequisito
      summary: Criar requisito
      description: 'Operação conforme §§5, 6.2–6.3 e 7.4. Revalidar acesso e estado no domínio proprietário. BFF
        Gestão (§4.2): consulta requisitos por troca de token, sem banco próprio; se domínio ou validação em Projetos
        e acesso falhar, retorna 503; não repete escrita automaticamente. Encaminha ETag, If-Match e Idempotency-Key.
        Location/_links externos usam /api/v1/gestao, sem revelar endereço interno.'
      tags:
      - requisitos
      x-papel-minimo: Editor
      x-escopo-mcp: athena:write
      x-projeto: projetoId
      x-decidir: Qual catálogo de tipos de requisito?
      x-proposta: true
      parameters:
      - $ref: ./_shared/components.yaml#/components/parameters/ProjetoId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./requisitos.yaml#/components/schemas/RequisitoEntrada
      responses:
        '201':
          description: Criação síncrona (§6.2).
          headers:
            Location:
              $ref: ./_shared/components.yaml#/components/headers/Location
          content:
            application/json:
              schema:
                $ref: ./requisitos.yaml#/components/schemas/Requisito
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
        '401':
          $ref: ./_shared/components.yaml#/components/responses/Erro401
        '403':
          $ref: ./_shared/components.yaml#/components/responses/Erro403
        '404':
          $ref: ./_shared/components.yaml#/components/responses/Erro404
        '409':
          $ref: ./_shared/components.yaml#/components/responses/Erro409
        '429':
          $ref: ./_shared/components.yaml#/components/responses/Erro429
        '503':
          $ref: ./_shared/components.yaml#/components/responses/Erro503
      security:
      - bearerJwt: []
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
  /api/v1/gestao/projetos/{projetoId}/requisitos/{requisitoId}:
    get:
