  /oauth2/authorize:
    get:
      operationId: autorizarAgente
      summary: Autorizar agente
      description: §7.5. Usuário autenticado escolhe projetos/escopos (inicial somente leitura); Authorization Code
        com PKCE S256 e state. Escopos independentes. Se não autenticado, frontend conduz login; esta rota não é
        exceção pública. Redirect somente URI de cliente registrada e validada.
      tags:
      - authorize
      x-papel-minimo: Leitor
      x-escopo-mcp: athena:read
      x-projeto: resolvido pelo recurso ou contexto autorizado; conta/workspace não concede papel em projeto
      security:
      - bearerJwt: []
      x-decidir: Como a sessão autenticada chega ao fluxo authorize mantendo JWT só em memória? Registro dinâmico
        de clientes indefinido.
      x-proposta: true
      responses:
        '302':
          description: Redireciona apenas para redirect_uri previamente validada com code e state; erro de autorização
            usa error e state (RFC 6749).
          headers:
            Location:
              description: Callback previamente registrado.
              schema:
                type: string
                example: http://127.0.0.1:8765/callback?code=opaco&state=estado-aleatorio
                format: uri
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
        '401':
          $ref: ./_shared/components.yaml#/components/responses/Erro401
        '403':
          $ref: ./_shared/components.yaml#/components/responses/Erro403
        '404':
          $ref: ./_shared/components.yaml#/components/responses/Erro404
        '409':
          $ref: ./_shared/components.yaml#/components/responses/Erro409
        '429':
          $ref: ./_shared/components.yaml#/components/responses/Erro429
        '503':
          $ref: ./_shared/components.yaml#/components/responses/Erro503
      parameters:
      - name: response_type
        in: query
        description: Filtro autorizado (§6.2); valor inválido retorna 400.
        schema:
          type: string
          const: code
          example: code
        required: true
      - name: client_id
        in: query
        description: Filtro autorizado (§6.2); valor inválido retorna 400.
        schema:
          type: string
          example: cliente-python
        required: true
      - name: redirect_uri
        in: query
        description: Filtro autorizado (§6.2); valor inválido retorna 400.
        schema:
          type: string
          example: http://127.0.0.1:8765/callback
          format: uri
        required: true
      - name: scope
        in: query
        description: Filtro autorizado (§6.2); valor inválido retorna 400.
        schema:
          type: string
          example: athena:read
        required: true
      - name: state
        in: query
        description: Filtro autorizado (§6.2); valor inválido retorna 400.
        schema:
          type: string
          example: estado-aleatorio
        required: true
      - name: code_challenge
        in: query
        description: Filtro autorizado (§6.2); valor inválido retorna 400.
        schema:
          type: string
          example: challenge-base64url
        required: true
      - name: code_challenge_method
        in: query
        description: Filtro autorizado (§6.2); valor inválido retorna 400.
        schema:
          type: string
          const: S256
          example: S256
        required: true
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
  /oauth2/token:
    post:
      operationId: emitirTokenOAuth
      summary: Emitir token o auth
      description: §§7.1–7.5. Authorization Code+PKCE para público (client_id+verifier); refresh rotacionado até
        30 dias absolutos; troca de token exige cliente serviço autenticado e reduz escopos, aud, usuário/projeto/delegação.
        Não exige bearer anterior para resgatar código. Autenticação de cliente público é validação PKCE; security
        oauthClient representa ramo confidencial, x-seguranca-condicional detalha público.
      tags:
      - token
      x-papel-minimo: Leitor
      x-escopo-mcp: athena:read
      x-projeto: resolvido pelo recurso ou contexto autorizado; conta/workspace não concede papel em projeto
      security:
      - oauthClient: []
      x-decidir: Confirmar autenticação dos clientes e interoperabilidade da troca nas bibliotecas; registro dinâmico
        não definido.
      x-proposta: true
      responses:
        '200':
          description: Consulta ou alteração concluída (§6.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokens'
        '400':
          description: Erro OAuth padronizado (RFC 6749/7009/8693); Gateway pode responder Problem Details antes
            do protocolo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErro'
              example:
                error: invalid_grant
            application/problem+json:
              schema:
                $ref: ./_shared/components.yaml#/components/schemas/ProblemDetails
              example: &id001
                type: urn:athena:problema:requisicao-invalida
                title: Requisição inválida
                status: 400
                detail: Requisição inválida.
                instance: /api/v1/gestao/projetos/22222222-2222-4222-8222-222222222222
                codigo: REQUISICAO_INVALIDA
                traceId: a3d9b24f670c48bca701d5f893ed45af
        '401':
          description: Erro OAuth padronizado (RFC 6749/7009/8693); Gateway pode responder Problem Details antes
            do protocolo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErro'
              example:
                error: invalid_grant
            application/problem+json:
              schema:
                $ref: ./_shared/components.yaml#/components/schemas/ProblemDetails
              example: &id002
                type: urn:athena:problema:nao-autenticado
                title: Credencial ou sessão inválida
                status: 401
                detail: Credencial ou sessão inválida.
                instance: /api/v1/gestao/projetos/22222222-2222-4222-8222-222222222222
                codigo: NAO_AUTENTICADO
                traceId: a3d9b24f670c48bca701d5f893ed45af
        '403':
          $ref: ./_shared/components.yaml#/components/responses/Erro403
        '404':
          $ref: ./_shared/components.yaml#/components/responses/Erro404
        '409':
          $ref: ./_shared/components.yaml#/components/responses/Erro409
        '429':
          $ref: ./_shared/components.yaml#/components/responses/Erro429
        '503':
          $ref: ./_shared/components.yaml#/components/responses/Erro503
      x-seguranca-condicional:
        authorization_code: 'Cliente público: client_id registrado + PKCE S256, sem HTTP Basic.'
        refresh_token: 'Cliente público: client_id e refresh válido; confidencial também autentica.'
        token_exchange: Cliente confidencial autenticado; valida sujeito e restrição de projeto.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
              - $ref: '#/components/schemas/OAuthCodigo'
              - $ref: '#/components/schemas/OAuthRefresh'
              - $ref: '#/components/schemas/OAuthTroca'
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
  /oauth2/revoke:
    post:
      operationId: revogarTokenOAuth
      summary: Revogar token o auth
      description: '§§7.2, 7.5. RFC 7009: token inválido também retorna 200 sem corpo. Revogar autorização MCP não
        encerra sessão da interface. Público exige client_id registrado e vinculação ao token; confidencial autentica
        cliente.'
      tags:
      - revoke
      x-papel-minimo: Leitor
      x-escopo-mcp: athena:admin
      x-projeto: resolvido pelo recurso ou contexto autorizado; conta/workspace não concede papel em projeto
      security:
      - oauthClient: []
      x-decidir: Confirmar método de autenticação de clientes públicos e confidenciais na revogação.
      x-proposta: true
      responses:
