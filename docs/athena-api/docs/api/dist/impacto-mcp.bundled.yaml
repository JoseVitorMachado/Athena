openapi: 3.1.0
info:
  title: ATHENA — Análise de Impacto/MCP
  version: 1.0.0
  description: 'Versionamento por URI (§6.2): /api/v1 para mudanças compatíveis, /api/v2 para quebra. Gateway roteia por prefixo; versão aparece nos logs; clientes Angular migram sem negociar cabeçalho. Versão da API independe da versão do requisito. Fonte de verdade: Arquitetura v1.0, §§6.11 e 7.5. APIs de domínio são internas; só BFFs, MCP e serviços com troca de token as chamam. Nenhuma leitura é pública por compartilhar URL. Escopos x-escopo-mcp só são exigidos em contexto delegado; nunca substituem papel/acesso. x-proposta identifica formas de representação não especificadas pelo livro.'
  contact:
    name: Equipe ATHENA
servers:
  - url: https://athena.example.invalid
    description: Origem HTTPS ilustrativa; substituir no ambiente.
security:
  - serviceToken: []
tags:
  - name: analises
    description: Recursos analises; §§5–7.
  - name: avaliacoes
    description: Recursos avaliacoes; §§5–7.
  - name: buscas
    description: Recursos buscas; §§5–7.
  - name: indice
    description: Recursos indice; §§5–7.
  - name: operacoes
    description: Recursos operacoes; §§5–7.
  - name: reindexacoes
    description: Recursos reindexacoes; §§5–7.
  - name: sugestoes
    description: Recursos sugestoes; §§5–7.
paths:
  /api/v1/projetos/{projetoId}/analises:
    post:
      operationId: criarAnalise
      summary: Criar analise
      description: §6.11. Persiste preparação de contexto; agente externo executa LLM e devolve sugestões não confiáveis. Backend gera apenas embeddings locais; falha LLM permite referências e fluxo manual.
      tags:
        - analises
      x-papel-minimo: Leitor
      x-escopo-mcp: athena:read
      x-projeto: projetoId
      x-decidir: Qual protocolo para agente registrar resultado da análise, estados e timeout sem agente conectado?
      x-proposta: true
      parameters:
        - $ref: '#/components/parameters/ProjetoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnaliseEntrada'
      responses:
        '202':
          description: Aceito; acompanhar Location; não indica conclusão (§6.2).
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analise'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
        '429':
          $ref: '#/components/responses/Erro429'
        '503':
          $ref: '#/components/responses/Erro503'
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de negócio seguem o livro e lacunas usam x-decidir.
    get:
      operationId: listarAnalises
      summary: Listar analises
      description: Operação conforme §§5, 6.2–6.3 e 7.4. Revalidar acesso e estado no domínio proprietário.
      tags:
        - analises
      x-papel-minimo: Leitor
      x-escopo-mcp: athena:read
      x-projeto: projetoId
      parameters:
        - $ref: '#/components/parameters/ProjetoId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Consulta ou alteração concluída (§6.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaAnalises'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
        '429':
          $ref: '#/components/responses/Erro429'
        '503':
          $ref: '#/components/responses/Erro503'
      x-proposta: true
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de negócio seguem o livro e lacunas usam x-decidir.
  /api/v1/projetos/{projetoId}/analises/{analiseId}:
    get:
      operationId: obterAnalise
      summary: Obter analise
      description: Operação conforme §§5, 6.2–6.3 e 7.4. Revalidar acesso e estado no domínio proprietário.
      tags:
        - analises
      x-papel-minimo: Leitor
      x-escopo-mcp: athena:read
      x-projeto: projetoId
      x-decidir: Definir catálogo de status da análise e estadoValidacao/tipo de sugestão.
      parameters:
        - $ref: '#/components/parameters/ProjetoId'
        - name: analiseId
          in: path
          required: true
          description: UUID do recurso (§5.1).
          schema:
            type: string
            example: 11111111-1111-4111-8111-111111111111
            format: uuid
      responses:
        '200':
          description: Consulta ou alteração concluída (§6.2).
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analise'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
        '429':
          $ref: '#/components/responses/Erro429'
        '503':
          $ref: '#/components/responses/Erro503'
      x-proposta: true
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de negócio seguem o livro e lacunas usam x-decidir.
  /api/v1/projetos/{projetoId}/analises/{analiseId}/sugestoes/{sugestaoId}/avaliacoes:
    post:
      operationId: criarAvaliacaoSugestao
      summary: Criar avaliacao sugestao
      description: §§6.11, 7.4–7.5. Revalida versão/hash e acesso oficial, inclusive rascunhos; 409 se desatualizados. Sugestão jamais se torna relação oficial sozinha; aplicação exige ação autorizada no domínio.
      tags:
        - avaliacoes
      x-papel-minimo: Editor
      x-escopo-mcp: athena:write
      x-projeto: projetoId
      x-decidir: Quais valores/efeitos da avaliação? Aceite cria relação na mesma chamada ou exige criação explícita no domínio?
      x-proposta: true
      parameters:
        - $ref: '#/components/parameters/ProjetoId'
        - name: analiseId
          in: path
          required: true
          description: UUID do recurso (§5.1).
          schema:
            type: string
            example: 11111111-1111-4111-8111-111111111111
            format: uuid
        - name: sugestaoId
          in: path
          required: true
          description: UUID do recurso (§5.1).
          schema:
            type: string
            example: 11111111-1111-4111-8111-111111111111
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvaliacaoEntrada'
      responses:
        '201':
          description: Criação síncrona (§6.2).
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Avaliacao'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
        '429':
          $ref: '#/components/responses/Erro429'
        '503':
          $ref: '#/components/responses/Erro503'
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de negócio seguem o livro e lacunas usam x-decidir.
  /api/v1/projetos/{projetoId}/contexto/buscas:
    post:
      operationId: buscarContexto
      summary: Buscar contexto
      description: §6.11. Busca híbrida textual/vetorial, cinco trechos padrão, remove duplicatas com referências. Filtra acesso antes de entregar e revalida nas fontes oficiais inclusive rascunhos/revogação. Similaridade não é probabilidade. Chunks 300–400 tokens, ~50 sobreposição, e5-small até 512, query:/passage:, vetores normalizados.
      tags:
        - buscas
      x-papel-minimo: Leitor
      x-escopo-mcp: athena:read
      x-projeto: projetoId
      x-proposta: true
      parameters:
        - $ref: '#/components/parameters/ProjetoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuscaEntrada'
      responses:
        '200':
          description: Consulta ou alteração concluída (§6.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Busca'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
        '429':
          $ref: '#/components/responses/Erro429'
        '503':
          $ref: '#/components/responses/Erro503'
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de negócio seguem o livro e lacunas usam x-decidir.
  /api/v1/projetos/{projetoId}/indice:
    get:
      operationId: obterIndice
      summary: Obter indice
      description: Operação conforme §§5, 6.2–6.3 e 7.4. Revalidar acesso e estado no domínio proprietário.
      tags:
        - indice
      x-papel-minimo: Leitor
      x-escopo-mcp: athena:read
      x-projeto: projetoId
      x-decidir: Quais situações do índice e unidade final do atraso?
      x-proposta: true
      parameters:
