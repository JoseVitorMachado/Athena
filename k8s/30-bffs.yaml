# BFFs: sem banco e sem estado, por isso podem ter várias réplicas
# (demonstração de escalabilidade: kubectl scale deployment/bff-gestao --replicas=3).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-gestao
  namespace: athena
  labels:
    app.kubernetes.io/name: bff-gestao
    app.kubernetes.io/part-of: athena
    athena/camada: bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bff-gestao
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bff-gestao
        app.kubernetes.io/part-of: athena
        athena/camada: bff
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
      containers:
        - name: bff-gestao
          image: athena/bff-gestao:0.3.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: REQUISITOS_URL
              valueFrom:
                configMapKeyRef:
                  name: athena-config
                  key: REQUISITOS_URL
            - name: REVISOES_URL
              valueFrom:
                configMapKeyRef:
                  name: athena-config
                  key: REVISOES_URL
            - name: RASTREABILIDADE_URL
              valueFrom:
                configMapKeyRef:
                  name: athena-config
                  key: RASTREABILIDADE_URL
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Startup dá tempo à JVM e às migrações; readiness controla o tráfego;
          # liveness não olha banco nem broker, para não reiniciar em cascata.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: bff-gestao
  namespace: athena
  labels:
    app.kubernetes.io/name: bff-gestao
    app.kubernetes.io/part-of: athena
    athena/camada: bff
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bff-gestao
  ports:
    - name: http
      port: 8080
      targetPort: http
---
