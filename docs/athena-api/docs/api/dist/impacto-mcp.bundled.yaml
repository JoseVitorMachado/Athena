                $ref: '#/components/schemas/PaginaOperacoes'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
        '429':
          $ref: '#/components/responses/Erro429'
        '503':
          $ref: '#/components/responses/Erro503'
      x-proposta: true
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de negócio seguem o livro e lacunas usam x-decidir.
  /api/v1/projetos/{projetoId}/operacoes/{operacaoId}:
    get:
      operationId: obterOperacaoImpacto
      summary: Obter operacao impacto
      description: Operação conforme §§5, 6.2–6.3 e 7.4. Revalidar acesso e estado no domínio proprietário.
      tags:
        - operacoes
      x-papel-minimo: Leitor
      x-escopo-mcp: athena:read
      x-projeto: projetoId
      parameters:
        - $ref: '#/components/parameters/ProjetoId'
        - name: operacaoId
          in: path
          required: true
          description: UUID do recurso (§5.1).
          schema:
            type: string
            example: 11111111-1111-4111-8111-111111111111
            format: uuid
      responses:
        '200':
          description: Consulta ou alteração concluída (§6.2).
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operacao'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
        '429':
          $ref: '#/components/responses/Erro429'
        '503':
          $ref: '#/components/responses/Erro503'
      x-proposta: true
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de negócio seguem o livro e lacunas usam x-decidir.
  /api/v1/projetos/{projetoId}/reindexacoes:
    post:
      operationId: criarReindexacao
      summary: Criar reindexacao
      description: §§6.8, 6.11. Trabalho persistido, revalida versão/exclusão antes de ativar chunks; troca atômica preserva anterior; trabalho atrasado não reativa dados excluídos.
      tags:
        - reindexacoes
      x-papel-minimo: Mantenedor
      x-escopo-mcp: athena:admin
      x-projeto: projetoId
      x-proposta: true
      parameters:
        - $ref: '#/components/parameters/ProjetoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: false
              example: {}
      responses:
        '202':
          description: Aceito; acompanhar Location; não indica conclusão (§6.2).
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operacao'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
