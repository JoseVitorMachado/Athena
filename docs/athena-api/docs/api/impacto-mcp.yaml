        negócio seguem o livro e lacunas usam x-decidir.
  /api/v1/projetos/{projetoId}/analises/{analiseId}/sugestoes:
    post:
      operationId: criarSugestaoAnalise
      summary: Criar sugestao analise
      description: §§6.11, 7.4–7.5. Proposta de rota de registro da saída externa não confiável; valida esquema,
        versões, evidências e acesso, sem criar relação oficial. Escopo athena:write e papel não substituem avaliação.
      tags:
      - sugestoes
      x-papel-minimo: Editor
      x-escopo-mcp: athena:write
      x-projeto: projetoId
      x-decidir: Confirmar fluxo/identificador para registrar sugestões do agente e papel de Repórter versus Editor.
      x-proposta: true
      parameters:
      - $ref: ./_shared/components.yaml#/components/parameters/ProjetoId
      - name: analiseId
        in: path
        required: true
        description: UUID do recurso (§5.1).
        schema:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Sugestao'
      responses:
        '201':
          description: Criação síncrona (§6.2).
          headers:
            Location:
              $ref: ./_shared/components.yaml#/components/headers/Location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugestao'
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
        '401':
          $ref: ./_shared/components.yaml#/components/responses/Erro401
        '403':
          $ref: ./_shared/components.yaml#/components/responses/Erro403
        '404':
          $ref: ./_shared/components.yaml#/components/responses/Erro404
        '409':
          $ref: ./_shared/components.yaml#/components/responses/Erro409
        '429':
          $ref: ./_shared/components.yaml#/components/responses/Erro429
        '503':
          $ref: ./_shared/components.yaml#/components/responses/Erro503
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
components:
  schemas:
    VersaoUtilizada:
      type: object
      properties:
        requisitoId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        versaoId:
          type: string
          example: 33333333-3333-4333-8333-333333333333
          format: uuid
        hashConteudo:
          type: string
          example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      additionalProperties: false
      required:
      - requisitoId
      - versaoId
      - hashConteudo
      example:
        requisitoId: 11111111-1111-4111-8111-111111111111
        versaoId: 33333333-3333-4333-8333-333333333333
        hashConteudo: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    Evidencia:
      type: object
      properties:
        origemId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        versaoId:
          type: string
          example: 33333333-3333-4333-8333-333333333333
          format: uuid
        trecho:
          type: string
          example: O documento deve ser exportável.
        referencia:
          type: string
          example: /api/v1/gestao/projetos/22222222-2222-4222-8222-222222222222/requisitos/11111111-1111-4111-8111-111111111111
          format: uri-reference
      additionalProperties: false
      required:
      - origemId
      - versaoId
      - trecho
      - referencia
      example: &id006
        origemId: 11111111-1111-4111-8111-111111111111
        versaoId: 33333333-3333-4333-8333-333333333333
        trecho: O documento deve ser exportável.
        referencia: /api/v1/gestao/projetos/22222222-2222-4222-8222-222222222222/requisitos/11111111-1111-4111-8111-111111111111
    Sugestao:
      type: object
      properties:
        sugestaoId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        tipo:
          type: string
          example: RELACAO
        requisitoAnalisadoId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        alvos:
          type: array
          items:
            type: string
            example: 11111111-1111-4111-8111-111111111111
            format: uuid
          example: &id001
          - 33333333-3333-4333-8333-333333333333
        versoesUtilizadas:
          type: array
          items:
            $ref: '#/components/schemas/VersaoUtilizada'
          example: &id002 []
        evidencias:
          type: array
          items:
            $ref: '#/components/schemas/Evidencia'
          example: &id003 []
        justificativa:
          type: string
          example: A alteração afeta requisito relacionado.
        estadoValidacao:
          type: string
          example: PENDENTE
      additionalProperties: false
      required:
      - sugestaoId
      - tipo
      - requisitoAnalisadoId
      - alvos
      - versoesUtilizadas
      - evidencias
      - justificativa
      - estadoValidacao
      example:
        sugestaoId: 11111111-1111-4111-8111-111111111111
        tipo: RELACAO
        requisitoAnalisadoId: 11111111-1111-4111-8111-111111111111
        alvos: *id001
        versoesUtilizadas: *id002
        evidencias: *id003
        justificativa: A alteração afeta requisito relacionado.
        estadoValidacao: PENDENTE
    AnaliseEntrada:
      type: object
      properties:
        requisitoId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
