      x-proposta: true
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
  /api/v1/projetos/{projetoId}/mapa/reconstrucoes:
    post:
      operationId: criarReconstrucaoMapa
      summary: Criar reconstrucao mapa
      description: §5.5. Uso exclusivo de serviço autorizado, sem rota no Gateway. Nova geração reaplica eventos
        e troca atomicamente; papel é limite do contexto delegado quando existir.
      tags:
      - interno
      x-papel-minimo: Mantenedor
      x-escopo-mcp: athena:admin
      x-projeto: projetoId
      x-decidir: Qual identidade de serviço pode iniciar reconstrução?
      x-interno: true
      parameters:
      - $ref: ./_shared/components.yaml#/components/parameters/ProjetoId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: false
              example: {}
      responses:
        '202':
          description: Aceito; acompanhar Location; não indica conclusão (§6.2).
          headers:
            Location:
              $ref: ./_shared/components.yaml#/components/headers/Location
          content:
            application/json:
              schema:
                $ref: ./_shared/components.yaml#/components/schemas/Operacao
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
