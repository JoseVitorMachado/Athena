        negócio seguem o livro e lacunas usam x-decidir.
  /api/v1/projetos/{projetoId}/reindexacoes:
    post:
      operationId: criarReindexacao
      summary: Criar reindexacao
      description: §§6.8, 6.11. Trabalho persistido, revalida versão/exclusão antes de ativar chunks; troca atômica
        preserva anterior; trabalho atrasado não reativa dados excluídos.
      tags:
      - reindexacoes
      x-papel-minimo: Mantenedor
      x-escopo-mcp: athena:admin
      x-projeto: projetoId
      x-proposta: true
      parameters:
      - $ref: ./_shared/components.yaml#/components/parameters/ProjetoId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: false
              example: {}
      responses:
        '202':
          description: Aceito; acompanhar Location; não indica conclusão (§6.2).
          headers:
            Location:
              $ref: ./_shared/components.yaml#/components/headers/Location
          content:
            application/json:
              schema:
                $ref: ./_shared/components.yaml#/components/schemas/Operacao
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
        '401':
