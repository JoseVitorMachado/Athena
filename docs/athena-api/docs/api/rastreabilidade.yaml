        negócio seguem o livro e lacunas usam x-decidir.
    patch:
      operationId: editarRelacao
      summary: Editar relacao
      description: '§5.4. Trava transacional por projeto em toda mutação; normalizar RELACIONADO_A. Proibir autorrelação,
        entre projetos, duplicação e ciclos por tipo e grafo combinado: DEPENDE_DE A→B implica precedência B→A;
        BLOQUEIA A→B implica A→B. RELACIONADO_A não participa de ciclos. Proposta: duplicação 409 RELACAO_DUPLICADA;
        ciclo 409 RELACAO_CICLICA; autorrelação/entre projetos 400.'
      tags:
      - relacoes
      x-papel-minimo: Editor
      x-escopo-mcp: athena:write
      x-projeto: projetoId
      x-decidir: Confirmar status dos conflitos de relações.
      x-proposta: true
      parameters:
      - $ref: ./_shared/components.yaml#/components/parameters/ProjetoId
      - name: relacaoId
        in: path
        required: true
        description: UUID do recurso (§5.1).
        schema:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      - $ref: ./_shared/components.yaml#/components/parameters/IfMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelacaoPatch'
      responses:
        '200':
          description: Consulta ou alteração concluída (§6.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relacao'
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
        '401':
          $ref: ./_shared/components.yaml#/components/responses/Erro401
        '403':
          $ref: ./_shared/components.yaml#/components/responses/Erro403
        '404':
          $ref: ./_shared/components.yaml#/components/responses/Erro404
        '409':
          description: Conflitos de negócio, conforme §§5.2–5.4 e 6.9. Códigos propostos estão em PROPOSTAS.md.
          content:
            application/problem+json:
              schema:
                $ref: ./_shared/components.yaml#/components/schemas/ProblemDetails
              examples:
                relacao-ciclica:
                  value:
                    type: urn:athena:problema:relacao-ciclica
                    title: Conflito com estado atual
                    status: 409
                    detail: 'Conflito: relacao ciclica.'
                    instance: /api/v1/gestao/projetos/22222222-2222-4222-8222-222222222222
                    codigo: RELACAO_CICLICA
                    traceId: a3d9b24f670c48bca701d5f893ed45af
                relacao-duplicada:
                  value:
                    type: urn:athena:problema:relacao-duplicada
                    title: Conflito com estado atual
                    status: 409
                    detail: 'Conflito: relacao duplicada.'
                    instance: /api/v1/gestao/projetos/22222222-2222-4222-8222-222222222222
                    codigo: RELACAO_DUPLICADA
                    traceId: a3d9b24f670c48bca701d5f893ed45af
        '429':
          $ref: ./_shared/components.yaml#/components/responses/Erro429
        '503':
          $ref: ./_shared/components.yaml#/components/responses/Erro503
        '412':
          $ref: ./_shared/components.yaml#/components/responses/Erro412
        '428':
          $ref: ./_shared/components.yaml#/components/responses/Erro428
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
    delete:
      operationId: removerRelacao
      summary: Remover relacao
      description: '§5.4. Trava transacional por projeto em toda mutação; normalizar RELACIONADO_A. Proibir autorrelação,
        entre projetos, duplicação e ciclos por tipo e grafo combinado: DEPENDE_DE A→B implica precedência B→A;
        BLOQUEIA A→B implica A→B. RELACIONADO_A não participa de ciclos. Proposta: duplicação 409 RELACAO_DUPLICADA;
        ciclo 409 RELACAO_CICLICA; autorrelação/entre projetos 400.'
      tags:
      - relacoes
      x-papel-minimo: Editor
      x-escopo-mcp: athena:write
      x-projeto: projetoId
      parameters:
      - $ref: ./_shared/components.yaml#/components/parameters/ProjetoId
      - name: relacaoId
        in: path
        required: true
        description: UUID do recurso (§5.1).
        schema:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      - $ref: ./_shared/components.yaml#/components/parameters/IfMatch
      responses:
        '204':
          description: Removido, sem corpo (§6.2).
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
        '401':
          $ref: ./_shared/components.yaml#/components/responses/Erro401
        '403':
          $ref: ./_shared/components.yaml#/components/responses/Erro403
        '404':
          $ref: ./_shared/components.yaml#/components/responses/Erro404
        '409':
          $ref: ./_shared/components.yaml#/components/responses/Erro409
        '429':
          $ref: ./_shared/components.yaml#/components/responses/Erro429
        '503':
          $ref: ./_shared/components.yaml#/components/responses/Erro503
        '412':
