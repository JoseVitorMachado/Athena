            $ref: '#/components/schemas/Requisito'
          example: []
        page:
          type: integer
          example: 0
          minimum: 0
        size:
          type: integer
          example: 20
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          example: 0
          minimum: 0
        totalPages:
          type: integer
          example: 0
          minimum: 0
        _links:
          $ref: '#/components/schemas/Links'
      additionalProperties: false
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
        - _links
      example:
        items: []
        page: 0
        size: 20
        totalElements: 0
        totalPages: 0
        _links: {}
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          example: urn:athena:problema:requisicao-invalida
          format: uri
          pattern: ^urn:athena:problema:[a-z0-9]+(?:-[a-z0-9]+)*$
        title:
          type: string
          example: Requisição inválida
        status:
          type: integer
          example: 400
          minimum: 400
          maximum: 599
        detail:
          type: string
          example: Verifique os campos enviados.
        instance:
          type: string
          example: /api/v1/gestao/projetos/22222222-2222-4222-8222-222222222222
          format: uri-reference
        codigo:
          type: string
          example: REQUISICAO_INVALIDA
        traceId:
          type: string
          example: a3d9b24f670c48bca701d5f893ed45af
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - instance
        - codigo
        - traceId
