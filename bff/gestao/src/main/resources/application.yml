# O BFF não tem estado nem banco: só precisa saber onde estão os serviços de
# domínio. Os endereços vêm de variáveis de ambiente (compose ou ConfigMap).

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: bff-gestao
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null

athena:
  servicos:
    requisitos: ${REQUISITOS_URL}
    revisoes: ${REVISOES_URL}
    rastreabilidade: ${RASTREABILIDADE_URL}
  http:
    timeout-conexao: ${HTTP_TIMEOUT_CONEXAO:2s}
    timeout-leitura: ${HTTP_TIMEOUT_LEITURA:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
