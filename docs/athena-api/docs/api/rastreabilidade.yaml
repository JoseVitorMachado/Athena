openapi: 3.1.0
info:
  title: ATHENA — Rastreabilidade
  version: 1.0.0
  description: 'Versionamento por URI (§6.2): /api/v1 para mudanças compatíveis, /api/v2 para quebra. Gateway roteia
    por prefixo; versão aparece nos logs; clientes Angular migram sem negociar cabeçalho. Versão da API independe
    da versão do requisito. Fonte de verdade: Arquitetura v1.0, §§5.4–5.5, 6.2–6.3 e 7.4. APIs de domínio são internas;
    só BFFs, MCP e serviços com troca de token as chamam. Nenhuma leitura é pública por compartilhar URL. Escopos
    x-escopo-mcp só são exigidos em contexto delegado; nunca substituem papel/acesso. x-proposta identifica formas
    de representação não especificadas pelo livro.'
  contact:
    name: Equipe ATHENA
servers:
- url: https://athena.example.invalid
  description: Origem HTTPS ilustrativa; substituir no ambiente.
security:
- serviceToken: []
tags:
- name: relacoes
  description: Recursos relacoes; §§5–7.
- name: mapa
  description: Recursos mapa; §§5–7.
- name: cobertura
  description: Recursos cobertura; §§5–7.
- name: retratos
  description: Recursos retratos; §§5–7.
- name: interno
  description: Recursos interno; §§5–7.
paths:
  /api/v1/projetos/{projetoId}/relacoes:
    get:
      operationId: listarRelacoes
      summary: Listar relacoes
      description: Operação conforme §§5, 6.2–6.3 e 7.4. Revalidar acesso e estado no domínio proprietário.
      tags:
      - relacoes
      x-papel-minimo: Leitor
      x-escopo-mcp: athena:read
      x-projeto: projetoId
      parameters:
      - $ref: ./_shared/components.yaml#/components/parameters/ProjetoId
      - $ref: ./_shared/components.yaml#/components/parameters/Page
      - $ref: ./_shared/components.yaml#/components/parameters/Size
      - $ref: ./_shared/components.yaml#/components/parameters/Sort
      - name: requisitoId
        in: query
        description: Filtro autorizado (§6.2); valor inválido retorna 400.
        schema:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      - name: tipo
        in: query
        description: Filtro autorizado (§6.2); valor inválido retorna 400.
        schema:
          $ref: ./_shared/components.yaml#/components/schemas/TipoRelacao
      responses:
        '200':
          description: Consulta ou alteração concluída (§6.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaRelacoes'
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
        '401':
          $ref: ./_shared/components.yaml#/components/responses/Erro401
        '403':
          $ref: ./_shared/components.yaml#/components/responses/Erro403
        '404':
          $ref: ./_shared/components.yaml#/components/responses/Erro404
        '409':
          $ref: ./_shared/components.yaml#/components/responses/Erro409
        '429':
          $ref: ./_shared/components.yaml#/components/responses/Erro429
        '503':
          $ref: ./_shared/components.yaml#/components/responses/Erro503
      x-proposta: true
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
    post:
      operationId: criarRelacao
      summary: Criar relacao
      description: '§5.4. Trava transacional por projeto em toda mutação; normalizar RELACIONADO_A. Proibir autorrelação,
        entre projetos, duplicação e ciclos por tipo e grafo combinado: DEPENDE_DE A→B implica precedência B→A;
        BLOQUEIA A→B implica A→B. RELACIONADO_A não participa de ciclos. Proposta: duplicação 409 RELACAO_DUPLICADA;
        ciclo 409 RELACAO_CICLICA; autorrelação/entre projetos 400.'
      tags:
      - relacoes
      x-papel-minimo: Editor
      x-escopo-mcp: athena:write
      x-projeto: projetoId
      x-decidir: Confirmar 409 para ciclo/duplicação e 400 para autorrelação/relação entre projetos.
      x-proposta: true
      parameters:
      - $ref: ./_shared/components.yaml#/components/parameters/ProjetoId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelacaoEntrada'
      responses:
        '201':
          description: Criação síncrona (§6.2).
          headers:
            Location:
              $ref: ./_shared/components.yaml#/components/headers/Location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relacao'
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
        '401':
          $ref: ./_shared/components.yaml#/components/responses/Erro401
        '403':
          $ref: ./_shared/components.yaml#/components/responses/Erro403
        '404':
          $ref: ./_shared/components.yaml#/components/responses/Erro404
        '409':
          description: Conflitos de negócio, conforme §§5.2–5.4 e 6.9. Códigos propostos estão em PROPOSTAS.md.
          content:
            application/problem+json:
              schema:
                $ref: ./_shared/components.yaml#/components/schemas/ProblemDetails
              examples:
                relacao-ciclica:
                  value:
                    type: urn:athena:problema:relacao-ciclica
                    title: Conflito com estado atual
                    status: 409
                    detail: 'Conflito: relacao ciclica.'
                    instance: /api/v1/gestao/projetos/22222222-2222-4222-8222-222222222222
                    codigo: RELACAO_CICLICA
                    traceId: a3d9b24f670c48bca701d5f893ed45af
                relacao-duplicada:
                  value:
                    type: urn:athena:problema:relacao-duplicada
                    title: Conflito com estado atual
                    status: 409
                    detail: 'Conflito: relacao duplicada.'
                    instance: /api/v1/gestao/projetos/22222222-2222-4222-8222-222222222222
                    codigo: RELACAO_DUPLICADA
                    traceId: a3d9b24f670c48bca701d5f893ed45af
        '429':
          $ref: ./_shared/components.yaml#/components/responses/Erro429
        '503':
          $ref: ./_shared/components.yaml#/components/responses/Erro503
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
  /api/v1/projetos/{projetoId}/relacoes/{relacaoId}:
