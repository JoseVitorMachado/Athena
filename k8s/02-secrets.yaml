# Credenciais dos bancos e do RabbitMQ.
#
# ATENÇÃO: os valores abaixo são de DESENVOLVIMENTO (os mesmos do .env.example)
# e existem só para o ambiente local subir com um comando. Em qualquer outro
# ambiente, não aplique este arquivo: crie os Secrets com valores reais, por
# exemplo:
#   kubectl -n athena create secret generic db-requisitos-credenciais \
#     --from-literal=usuario=requisitos --from-literal=senha="$(openssl rand -base64 24)"
#
# A chave privada do JWT não fica aqui nem em nenhum arquivo do repositório:
# o Secret athena-jwt é criado por comando (veja o README).
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credenciais
  namespace: athena
  labels:
    app.kubernetes.io/part-of: athena
type: Opaque
stringData:
  usuario: athena
  # Sem aspas duplas nem barra invertida (limitação da imagem do RabbitMQ).
  senha: dev_rabbitmq
---
