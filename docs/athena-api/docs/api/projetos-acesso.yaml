                error: invalid_grant
            application/problem+json:
              schema:
                $ref: ./_shared/components.yaml#/components/schemas/ProblemDetails
              example: *id001
        '401':
          description: Erro OAuth padronizado (RFC 6749/7009/8693); Gateway pode responder Problem Details antes
            do protocolo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErro'
              example:
                error: invalid_grant
            application/problem+json:
              schema:
                $ref: ./_shared/components.yaml#/components/schemas/ProblemDetails
              example: *id002
        '403':
          $ref: ./_shared/components.yaml#/components/responses/Erro403
        '404':
          $ref: ./_shared/components.yaml#/components/responses/Erro404
        '409':
          $ref: ./_shared/components.yaml#/components/responses/Erro409
        '429':
          $ref: ./_shared/components.yaml#/components/responses/Erro429
        '503':
          $ref: ./_shared/components.yaml#/components/responses/Erro503
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthRevogacao'
      x-seguranca-condicional:
        publico: client_id validado e token vinculado
        confidencial: HTTP Basic validado
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
components:
  schemas:
    CadastroEntrada:
      type: object
      properties:
        nome:
          type: string
          example: Fernando
        email:
          type: string
          example: fernando@example.invalid
          format: email
        senha:
          type: string
          example: senha-apenas-ilustrativa
          writeOnly: true
      additionalProperties: false
      required:
      - nome
      - email
      - senha
      example:
        nome: Fernando
        email: fernando@example.invalid
        senha: senha-apenas-ilustrativa
    Usuario:
      type: object
      properties:
        usuarioId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        nome:
          type: string
          example: Fernando
        email:
          type: string
          example: fernando@example.invalid
          format: email
      additionalProperties: false
      required:
      - usuarioId
      - nome
      - email
      example:
        usuarioId: 11111111-1111-4111-8111-111111111111
        nome: Fernando
        email: fernando@example.invalid
    LoginEntrada:
      type: object
      properties:
        email:
          type: string
          example: fernando@example.invalid
          format: email
        senha:
          type: string
          example: senha-apenas-ilustrativa
          writeOnly: true
        lembrarDispositivo:
          type: boolean
          example: false
      additionalProperties: false
      required:
      - email
      - senha
      example:
        email: fernando@example.invalid
        senha: senha-apenas-ilustrativa
    Sessao:
      type: object
      properties:
        accessToken:
          type: string
          example: jwt-ilustrativo
        tokenType:
          type: string
          const: Bearer
          example: Bearer
        expiraEm:
          type: string
          example: '2026-10-21T15:00:00Z'
          format: date-time
          pattern: Z$
        csrfToken:
          type: string
          example: csrf-opaco-ilustrativo
      additionalProperties: false
      required:
      - accessToken
      - tokenType
      - expiraEm
      - csrfToken
      example:
        accessToken: jwt-ilustrativo
        tokenType: Bearer
        expiraEm: '2026-10-21T15:00:00Z'
        csrfToken: csrf-opaco-ilustrativo
    RecuperacaoEntrada:
      type: object
      properties:
        email:
          type: string
          example: fernando@example.invalid
          format: email
      additionalProperties: false
      required:
      - email
      example:
        email: fernando@example.invalid
    RecuperacaoAceita:
      type: object
      properties:
        mensagem:
          type: string
          example: Se a conta estiver elegível, enviaremos as instruções.
      additionalProperties: false
      required:
      - mensagem
      example:
        mensagem: Se a conta estiver elegível, enviaremos as instruções.
    RecuperacaoConclusao:
      type: object
      properties:
        credencial:
          type: string
          example: credencial-opaca
          writeOnly: true
        novaSenha:
          type: string
          example: nova-senha-ilustrativa
          writeOnly: true
      additionalProperties: false
      required:
      - credencial
      - novaSenha
      example:
        credencial: credencial-opaca
        novaSenha: nova-senha-ilustrativa
    AutorizacaoAgente:
      type: object
      properties:
        autorizacaoId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        clienteId:
          type: string
          example: cliente-python
        projetos:
          type: array
          items:
            type: string
            example: 22222222-2222-4222-8222-222222222222
            format: uuid
          example: &id003
          - 22222222-2222-4222-8222-222222222222
        escopos:
          type: array
          items:
            type: string
            example: athena:read
          example: &id004
          - athena:read
        criadaEm:
          type: string
          example: '2026-10-21T15:00:00Z'
          format: date-time
          pattern: Z$
        expiraEm:
          type: string
          example: '2026-10-21T15:00:00Z'
          format: date-time
          pattern: Z$
      additionalProperties: false
      required:
      - autorizacaoId
      - clienteId
      - projetos
      - escopos
      - criadaEm
      - expiraEm
      example:
        autorizacaoId: 11111111-1111-4111-8111-111111111111
        clienteId: cliente-python
        projetos: *id003
        escopos: *id004
        criadaEm: '2026-10-21T15:00:00Z'
        expiraEm: '2026-10-21T15:00:00Z'
    WorkspaceEntrada:
      type: object
      properties:
        nome:
          type: string
          example: Equipe ATHENA
      additionalProperties: false
      required:
      - nome
      example:
        nome: Equipe ATHENA
    Workspace:
      type: object
      properties:
        workspaceId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        nome:
          type: string
          example: Equipe ATHENA
        ownerId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        atualizadoEm:
          type: string
          example: '2026-10-21T15:00:00Z'
          format: date-time
          pattern: Z$
      additionalProperties: false
      required:
      - workspaceId
      - nome
      - ownerId
      - atualizadoEm
      example:
        workspaceId: 11111111-1111-4111-8111-111111111111
        nome: Equipe ATHENA
        ownerId: 11111111-1111-4111-8111-111111111111
        atualizadoEm: '2026-10-21T15:00:00Z'
    WorkspacePatch:
      type: object
      properties:
        nome:
          type: string
          example: Equipe ATHENA atualizada
      additionalProperties: false
      required:
      - nome
      example:
        nome: Equipe ATHENA atualizada
    ProjetoEntrada:
      type: object
      properties:
        workspaceId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        nome:
          type: string
          example: ATHENA
        descricao:
          type: string
          example: Gestão de requisitos
      additionalProperties: false
      required:
      - workspaceId
      - nome
      example:
        workspaceId: 11111111-1111-4111-8111-111111111111
        nome: ATHENA
    Projeto:
      type: object
      properties:
        projetoId:
          type: string
          example: 22222222-2222-4222-8222-222222222222
          format: uuid
        workspaceId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        nome:
          type: string
          example: ATHENA
        descricao:
          type: string
          example: Gestão de requisitos
        arquivado:
          type: boolean
          example: false
