components:
  schemas:
    RequisitoGestao:
      type: object
      properties:
        requisitoId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        projetoId:
          type: string
          example: 22222222-2222-4222-8222-222222222222
          format: uuid
        codigo:
          type: string
          example: REQ-42
          pattern: ^REQ-[0-9]+$
        titulo:
          type: string
          example: Exportar documento de requisitos.
        situacao:
          $ref: ./_shared/components.yaml#/components/schemas/SituacaoRequisito
        versaoEmEdicao:
          type: integer
          example: 4
          minimum: 1
        versaoId:
          type: string
          example: 33333333-3333-4333-8333-333333333333
          format: uuid
        estadoVersao:
          $ref: ./_shared/components.yaml#/components/schemas/EstadoVersao
        loteId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        pendenciasAbertas:
          type: integer
          example: 2
          minimum: 0
        atualizadoEm:
          type: string
          example: '2026-10-21T15:00:00Z'
          format: date-time
          pattern: Z$
        _links:
          $ref: ./_shared/components.yaml#/components/schemas/Links
        _actions:
          $ref: ./_shared/components.yaml#/components/schemas/Actions
        avisos:
          type: array
          items:
            type: string
            example: Revisões indisponível.
          example: []
      additionalProperties: false
      required:
      - requisitoId
      - projetoId
      - codigo
      - titulo
      - situacao
      - atualizadoEm
      - _links
      - _actions
      - avisos
      example:
        requisitoId: 11111111-1111-4111-8111-111111111111
        projetoId: 22222222-2222-4222-8222-222222222222
        codigo: REQ-42
        titulo: Exportar documento de requisitos.
        situacao: ATIVO
        atualizadoEm: '2026-10-21T15:00:00Z'
        _links: {}
        _actions: {}
        avisos: []
  securitySchemes:
    bearerJwt:
      $ref: ./_shared/components.yaml#/components/securitySchemes/bearerJwt
    serviceToken:
      $ref: ./_shared/components.yaml#/components/securitySchemes/serviceToken
    cookieRefresh:
      $ref: ./_shared/components.yaml#/components/securitySchemes/cookieRefresh
    csrf:
      $ref: ./_shared/components.yaml#/components/securitySchemes/csrf
    oauthClient:
      $ref: ./_shared/components.yaml#/components/securitySchemes/oauthClient
