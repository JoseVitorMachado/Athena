openapi: 3.1.0
info:
  title: ATHENA — Integrações
  version: 1.0.0
  description: 'Versionamento por URI (§6.2): /api/v1 para mudanças compatíveis, /api/v2 para quebra. Gateway roteia por prefixo; versão aparece nos logs; clientes Angular migram sem negociar cabeçalho. Versão da API independe da versão do requisito. Fonte de verdade: Arquitetura v1.0, §§6.10, 7.4 e 7.5. APIs de domínio são internas; só BFFs, MCP e serviços com troca de token as chamam. Nenhuma leitura é pública por compartilhar URL. Escopos x-escopo-mcp só são exigidos em contexto delegado; nunca substituem papel/acesso. x-proposta identifica formas de representação não especificadas pelo livro.'
  contact:
    name: Equipe ATHENA
servers:
  - url: https://athena.example.invalid
    description: Origem HTTPS ilustrativa; substituir no ambiente.
security:
  - serviceToken: []
tags:
  - name: conexoes
    description: Recursos conexoes; §§5–7.
  - name: vinculos
    description: Recursos vinculos; §§5–7.
  - name: sincronizacoes
    description: Recursos sincronizacoes; §§5–7.
  - name: resolucoes
    description: Recursos resolucoes; §§5–7.
  - name: tarefas-externas
    description: Recursos tarefas-externas; §§5–7.
paths:
  /api/v1/projetos/{projetoId}/conexoes:
    get:
      operationId: listarConexoes
      summary: Listar conexoes
      description: §6.10. Credenciais só writeOnly no backend, nunca retornadas. Google prioriza drive.file com seleção explícita; OpenProject com mínimo acesso ao projeto. GitHub MVP somente vínculos. Importação explícita entra como rascunho/proposta, jamais sobrescreve publicada. Fluxo de autorização de conectores não definido.
      tags:
        - conexoes
      x-papel-minimo: Mantenedor
      x-escopo-mcp: athena:read
      x-projeto: projetoId
      parameters:
        - $ref: '#/components/parameters/ProjetoId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Consulta ou alteração concluída (§6.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaConexoes'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
        '429':
          $ref: '#/components/responses/Erro429'
        '503':
          $ref: '#/components/responses/Erro503'
      x-proposta: true
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de negócio seguem o livro e lacunas usam x-decidir.
    post:
      operationId: criarConexao
      summary: Criar conexao
      description: §6.10. Credenciais só writeOnly no backend, nunca retornadas. Google prioriza drive.file com seleção explícita; OpenProject com mínimo acesso ao projeto. GitHub MVP somente vínculos. Importação explícita entra como rascunho/proposta, jamais sobrescreve publicada. Fluxo de autorização de conectores não definido.
      tags:
        - conexoes
      x-papel-minimo: Mantenedor
      x-escopo-mcp: athena:admin
      x-projeto: projetoId
      x-decidir: Como autorizar conectores Google/OpenProject e quais operações são suportadas?
      x-proposta: true
      parameters:
        - $ref: '#/components/parameters/ProjetoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConexaoEntrada'
      responses:
        '201':
          description: Criação síncrona (§6.2).
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conexao'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
        '429':
          $ref: '#/components/responses/Erro429'
        '503':
          $ref: '#/components/responses/Erro503'
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de negócio seguem o livro e lacunas usam x-decidir.
