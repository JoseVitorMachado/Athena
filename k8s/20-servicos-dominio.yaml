# Serviços de domínio: Deployment + Service ClusterIP (sem exposição externa).
# Cada um fala só com o próprio banco (veja 50-network-policies.yaml).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: projetos-acesso
  namespace: athena
  labels:
    app.kubernetes.io/name: projetos-acesso
    app.kubernetes.io/part-of: athena
    athena/camada: dominio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: projetos-acesso
  template:
    metadata:
      labels:
        app.kubernetes.io/name: projetos-acesso
        app.kubernetes.io/part-of: athena
        athena/camada: dominio
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
      containers:
        - name: projetos-acesso
          image: athena/projetos-acesso:0.3.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: athena-config
                  key: PROJETOS_ACESSO_DB_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: athena-config
                  key: PROJETOS_ACESSO_DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-projetos-acesso-credenciais
                  key: usuario
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-projetos-acesso-credenciais
                  key: senha
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: athena-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credenciais
                  key: usuario
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credenciais
                  key: senha
            - name: FLYWAY_LOCATIONS
              valueFrom:
                configMapKeyRef:
                  name: athena-config
                  key: FLYWAY_LOCATIONS
            - name: JWT_CHAVE_PRIVADA_ARQUIVO
              valueFrom:
                configMapKeyRef:
                  name: athena-config
                  key: JWT_CHAVE_PRIVADA_ARQUIVO
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Startup dá tempo à JVM e às migrações; readiness controla o tráfego;
          # liveness não olha banco nem broker, para não reiniciar em cascata.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: jwt
              mountPath: /etc/athena/jwt
              readOnly: true
      volumes:
        # Chave privada RS256 do emissor de tokens (Secret criado por comando).
        - name: jwt
          secret:
            secretName: athena-jwt
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: projetos-acesso
  namespace: athena
  labels:
    app.kubernetes.io/name: projetos-acesso
    app.kubernetes.io/part-of: athena
    athena/camada: dominio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: projetos-acesso
  ports:
    - name: http
      port: 8080
      targetPort: http
---
