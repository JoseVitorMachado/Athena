# Monitoramento opcional: kubectl apply -f k8s/extras/monitoramento.yaml
# Acesse o Grafana com kubectl -n athena port-forward svc/grafana 3000:3000.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: athena
  labels:
    app.kubernetes.io/part-of: athena
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    
    scrape_configs:
      - job_name: projetos-acesso
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["projetos-acesso.athena.svc.cluster.local:8080"]
            labels:
              servico: projetos-acesso
      - job_name: requisitos
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["requisitos.athena.svc.cluster.local:8080"]
            labels:
              servico: requisitos
      - job_name: rastreabilidade
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["rastreabilidade.athena.svc.cluster.local:8080"]
            labels:
              servico: rastreabilidade
      - job_name: revisoes
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["revisoes.athena.svc.cluster.local:8080"]
            labels:
              servico: revisoes
      - job_name: integracoes
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["integracoes.athena.svc.cluster.local:8080"]
            labels:
              servico: integracoes
      - job_name: bff-gestao
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["bff-gestao.athena.svc.cluster.local:8080"]
            labels:
              servico: bff-gestao
      - job_name: bff-livro
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["bff-livro.athena.svc.cluster.local:8080"]
            labels:
              servico: bff-livro
      - job_name: gateway
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["gateway.athena.svc.cluster.local:8081"]
            labels:
              servico: gateway
      - job_name: impacto-mcp
        metrics_path: /metrics
        static_configs:
          - targets: ["impacto-mcp.athena.svc.cluster.local:8000"]
            labels:
              servico: impacto-mcp
      - job_name: prometheus
        metrics_path: /metrics
        static_configs:
          - targets: ["prometheus.athena.svc.cluster.local:9090"]
            labels:
              servico: prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: athena
  labels:
    app.kubernetes.io/part-of: athena
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
  athena.yml: |
    apiVersion: 1
    providers:
      - name: ATHENA
        orgId: 1
        type: file
        disableDeletion: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: athena
  labels:
    app.kubernetes.io/part-of: athena
data:
  athena.json: |
    {
      "uid": "athena-visao-geral",
      "title": "ATHENA — visão geral",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "application",
            "label": "Aplicação",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(http_server_requests_seconds_count, application)",
            "refresh": 1,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Requisições por segundo por serviço",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (application) (rate(http_server_requests_seconds_count{application=~\"$application\"}[1m]))",
              "legendFormat": "__auto"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "Latência p95 por serviço",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, application) (rate(http_server_requests_seconds_bucket{application=~\"$application\"}[5m])))",
              "legendFormat": "__auto"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Erros 5xx por segundo por serviço",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (application) (rate(http_server_requests_seconds_count{status=~\"5..\",application=~\"$application\"}[1m]))",
              "legendFormat": "__auto"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "Outbox pendente por serviço",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (application) (athena_outbox_pendentes{application=~\"$application\"})",
              "legendFormat": "__auto"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "title": "Transições da SAGA por destino",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (para) (rate(athena_saga_transicoes_total{application=~\"$application\"}[5m]))",
              "legendFormat": "__auto"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "title": "Exclusões em andamento",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(athena_exclusoes_em_andamento{application=~\"$application\"})",
              "legendFormat": "__auto"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "title": "Ferramentas MCP — latência p95",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, ferramenta) (rate(athena_mcp_ferramenta_segundos_bucket[5m])))",
              "legendFormat": "__auto"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "title": "Embeddings — latência p95",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(athena_embeddings_segundos_bucket[5m])))",
              "legendFormat": "__auto"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 9,
          "title": "Indexação pendente",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 32
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "athena_indexacao_pendentes",
              "legendFormat": "__auto"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "id": 10,
          "title": "Heap JVM usado por serviço",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 32
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (application) (jvm_memory_used_bytes{area=\"heap\",application=~\"$application\"})",
              "legendFormat": "__auto"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          }
        },
        {
          "id": 11,
          "title": "Serviços no ar",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 40
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "up",
              "legendFormat": "__auto"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: athena
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: athena
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: athena
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: dados, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: dados
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: athena
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: athena
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: athena
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: athena
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: athena
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - {name: GF_SECURITY_ADMIN_PASSWORD, value: athena}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
          livenessProbe:
            httpGet: {path: /api/health, port: http}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/prometheus.yml, subPath: prometheus.yml, readOnly: true}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/athena.yml, subPath: athena.yml, readOnly: true}
            - {name: dashboard, mountPath: /var/lib/grafana/dashboards, readOnly: true}
            - {name: dados, mountPath: /var/lib/grafana}
      volumes:
        - name: provisioning
          configMap: {name: grafana-provisioning}
        - name: dashboard
          configMap: {name: grafana-dashboard}
        - name: dados
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: athena
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: athena
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
