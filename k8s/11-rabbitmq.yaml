# Broker de mensagens: Service headless + StatefulSet com volume próprio.
# As exchanges athena.commands e athena.events vêm declaradas na imagem.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: athena
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: athena
    athena/camada: mensageria
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: gestao
      port: 15672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: athena
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: athena
    athena/camada: mensageria
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: athena
        athena/camada: mensageria
    spec:
      securityContext:
        fsGroup: 101
      containers:
        - name: rabbitmq
          image: athena/rabbitmq:4.3.7-1
          ports:
            - name: amqp
              containerPort: 5672
            - name: gestao
              containerPort: 15672
          env:
            # O nome do nó identifica os dados no volume. "localhost" resolve
            # sempre e não muda quando o pod é recriado.
            - name: RABBITMQ_NODENAME
              value: rabbit@localhost
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credenciais
                  key: usuario
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credenciais
                  key: senha
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          # Probes por TCP na porta AMQP: as ferramentas de linha de comando do
          # Erlang são lentas para iniciar e estouravam o tempo da probe.
          startupProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: dados
              mountPath: /var/lib/rabbitmq
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: dados
        labels:
          app.kubernetes.io/name: rabbitmq
          app.kubernetes.io/part-of: athena
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
