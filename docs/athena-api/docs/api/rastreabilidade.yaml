      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
components:
  schemas:
    RelacaoEntrada:
      type: object
      properties:
        origemId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        destinoId:
          type: string
          example: 33333333-3333-4333-8333-333333333333
          format: uuid
        tipo:
          $ref: ./_shared/components.yaml#/components/schemas/TipoRelacao
        justificativa:
          type: string
          example: Dependência funcional
      additionalProperties: false
      required:
      - origemId
      - destinoId
      - tipo
      example:
        origemId: 11111111-1111-4111-8111-111111111111
        destinoId: 33333333-3333-4333-8333-333333333333
        tipo: DEPENDE_DE
    RelacaoPatch:
      type: object
      properties:
        origemId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        destinoId:
          type: string
          example: 33333333-3333-4333-8333-333333333333
          format: uuid
        tipo:
          $ref: ./_shared/components.yaml#/components/schemas/TipoRelacao
        justificativa:
          type: string
          example: Dependência funcional
      additionalProperties: false
      minProperties: 1
      example:
        justificativa: Dependência esclarecida.
    Relacao:
      type: object
      properties:
        relacaoId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        projetoId:
          type: string
          example: 22222222-2222-4222-8222-222222222222
          format: uuid
        origemId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        destinoId:
          type: string
          example: 33333333-3333-4333-8333-333333333333
          format: uuid
        tipo:
          $ref: ./_shared/components.yaml#/components/schemas/TipoRelacao
        justificativa:
          type: string
          example: Dependência funcional
        atualizadoEm:
          type: string
          example: '2026-10-21T15:00:00Z'
          format: date-time
          pattern: Z$
      additionalProperties: false
      required:
      - relacaoId
      - projetoId
      - origemId
      - destinoId
      - tipo
      - atualizadoEm
      example:
        relacaoId: 11111111-1111-4111-8111-111111111111
        projetoId: 22222222-2222-4222-8222-222222222222
        origemId: 11111111-1111-4111-8111-111111111111
        destinoId: 33333333-3333-4333-8333-333333333333
        tipo: DEPENDE_DE
        atualizadoEm: '2026-10-21T15:00:00Z'
    NoMapa:
      type: object
      properties:
        requisitoId:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        titulo:
          type: string
