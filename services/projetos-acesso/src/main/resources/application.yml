# Toda a configuração que muda entre ambientes vem de variáveis de ambiente:
# no compose, do docker-compose.yml; no Kubernetes, de ConfigMap e Secret.

server:
  # Redirecionamentos relativos (Location sem host): atrás do Gateway, do nginx
  # dos clientes ou do Ingress, o navegador nunca recebe o nome interno do container.
  tomcat:
    use-relative-redirects: true
  port: ${SERVER_PORT:8080}
  # Atrás do Gateway, o IP do cliente vem em X-Forwarded-For. O Tomcat só confia nesse
  # cabeçalho quando o salto anterior é de rede interna, então os limites por IP da
  # recuperação de senha enxergam o cliente, não o Gateway.
  forward-headers-strategy: native
  shutdown: graceful

spring:
  application:
    name: projetos-acesso
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USUARIO:}
    password: ${SMTP_SENHA:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # db/migration cria o esquema; db/demo (opcional) carrega dados de demonstração.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    ignore-migration-patterns: "*:missing"
    # Os dados de demonstração usam versões altas (V900+). Sem isto, um banco que já
    # recebeu a demo recusaria migrações de esquema novas (V3, V4...).
    out-of-order: true
  rabbitmq:
    publisher-confirm-type: simple
    # Falha rápido com o broker fora: o publicador registra a falha na outbox e
    # tenta de novo, em vez de ficar preso no padrão de 60 s do cliente.
    connection-timeout: 5s
    listener:
      simple:
        prefetch: 10
        default-requeue-rejected: false
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        # Liveness não depende de banco nem de broker: uma dependência fora do ar
        # não deve reiniciar o serviço em cascata (livro §8.2).
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

athena:
  email:
    remetente: ${ATHENA_EMAIL_REMETENTE:nao-responda@athena.local}
  recuperacao:
    # Use um segredo exclusivo e compartilhado pelas réplicas em produção.
    segredo: ${ATHENA_RECUPERACAO_SEGREDO:${DB_PASSWORD}}
  # Enquanto não há autenticação (Parte 4), as ações são atribuídas a este usuário.
  usuario-demo: ${ATHENA_USUARIO_DEMO:55555555-5555-4555-8555-555555555555}
  jwt:
    # Chave privada RSA (PEM, PKCS#8) usada para assinar os JWTs. No Kubernetes vem
    # de um Secret montado como arquivo. Vazio: gera uma chave efêmera, só para
    # desenvolvimento, que muda a cada subida.
    chave-privada-arquivo: ${JWT_CHAVE_PRIVADA_ARQUIVO:}

  exclusao:
    reenvio: ${ATHENA_EXCLUSAO_REENVIO:15s}
    participantes: ${ATHENA_EXCLUSAO_PARTICIPANTES:requisitos,rastreabilidade,revisoes,integracoes,impacto-mcp}
  mensageria:
    servico: projetos-acesso
    eventos-assinados:
      - requisitos.ProjetoFechado
      - requisitos.ProjetoLimpo
      - rastreabilidade.ProjetoFechado
      - rastreabilidade.ProjetoLimpo
      - revisoes.ProjetoFechado
      - revisoes.ProjetoLimpo
      - integracoes.ProjetoFechado
      - integracoes.ProjetoLimpo
      - impacto-mcp.ProjetoFechado
      - impacto-mcp.ProjetoLimpo
      - requisitos.ComentarioCriado
      - requisitos.SubmissaoConcluida
      - requisitos.DecisaoRevisaoAplicada
    intervalo-publicacao: 500ms
    lote-publicacao: 50

# O Gateway encaminha apenas os prefixos dos módulos; inclusive os recursos da
# interface e sua configuração precisam permanecer sob o mesmo prefixo.
springdoc:
  paths-to-match: /api/v1/autenticacao/**,/api/v1/usuarios/**
  api-docs:
    path: /api/v1/autenticacao/docs/openapi.json
  swagger-ui:
    path: /api/v1/autenticacao/docs/index.html
    url: /api/v1/autenticacao/docs/openapi.json
    config-url: /api/v1/autenticacao/docs/openapi.json/swagger-config
    disable-swagger-default-url: true
    oauth2-redirect-url: /api/v1/autenticacao/docs/swagger-ui/oauth2-redirect.html
    try-it-out-enabled: true
    persist-authorization: true
    with-credentials: true
