# Caixa de e-mails de desenvolvimento; em produção use um SMTP real.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: athena
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: athena
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/part-of: athena
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.20.4
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: athena
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: athena
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
