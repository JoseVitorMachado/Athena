openapi: 3.1.0
info:
  title: ATHENA — Projetos e acesso
  version: 1.0.0
  description: 'Versionamento por URI (§6.2): /api/v1 para mudanças compatíveis, /api/v2 para quebra. Gateway roteia
    por prefixo; versão aparece nos logs; clientes Angular migram sem negociar cabeçalho. Versão da API independe
    da versão do requisito. Fonte de verdade: Arquitetura v1.0, §§5.6, 6.1, 7.1–7.5. APIs de domínio são internas;
    só BFFs, MCP e serviços com troca de token as chamam. Nenhuma leitura é pública por compartilhar URL. Escopos
    x-escopo-mcp só são exigidos em contexto delegado; nunca substituem papel/acesso. x-proposta identifica formas
    de representação não especificadas pelo livro.'
  contact:
    name: Equipe ATHENA
servers:
- url: https://athena.example.invalid
  description: Origem HTTPS ilustrativa; substituir no ambiente.
security:
- serviceToken: []
tags:
- name: cadastro
  description: Recursos cadastro; §§5–7.
- name: login
  description: Recursos login; §§5–7.
- name: recuperacao
  description: Recursos recuperacao; §§5–7.
- name: conclusao
  description: Recursos conclusao; §§5–7.
- name: renovacao
  description: Recursos renovacao; §§5–7.
- name: logout
  description: Recursos logout; §§5–7.
- name: me
  description: Recursos me; §§5–7.
- name: autorizacoes-agente
  description: Recursos autorizacoes-agente; §§5–7.
- name: workspaces
  description: Recursos workspaces; §§5–7.
- name: projetos
  description: Recursos projetos; §§5–7.
- name: exclusoes
  description: Recursos exclusoes; §§5–7.
- name: membros
  description: Recursos membros; §§5–7.
- name: arquivamentos
  description: Recursos arquivamentos; §§5–7.
- name: restauracoes
  description: Recursos restauracoes; §§5–7.
- name: historico-membros
  description: Recursos historico-membros; §§5–7.
- name: convites
  description: Recursos convites; §§5–7.
- name: aceite
  description: Recursos aceite; §§5–7.
- name: transferencias-propriedade
  description: Recursos transferencias-propriedade; §§5–7.
- name: notificacoes
  description: Recursos notificacoes; §§5–7.
- name: interno
  description: Recursos interno; §§5–7.
- name: jwks
  description: Recursos jwks; §§5–7.
- name: oauth-authorization-server
  description: Recursos oauth-authorization-server; §§5–7.
- name: oauth-protected-resource
  description: Recursos oauth-protected-resource; §§5–7.
- name: authorize
  description: Recursos authorize; §§5–7.
- name: token
  description: Recursos token; §§5–7.
- name: revoke
  description: Recursos revoke; §§5–7.
paths:
  /api/v1/autenticacao/cadastro:
    post:
      operationId: criarCadastro
      summary: Criar cadastro
      description: §§7.1–7.3. Cadastro por e-mail/senha; Argon2id. Política detalhada de senha ainda não definida.
      tags:
      - cadastro
      security: []
      x-decidir: Qual política de senha e validação de e-mail?
      x-proposta: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroEntrada'
      responses:
        '201':
          description: Criação síncrona (§6.2).
          headers:
            Location:
              $ref: ./_shared/components.yaml#/components/headers/Location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
        '429':
          $ref: ./_shared/components.yaml#/components/responses/Erro429
        '503':
          $ref: ./_shared/components.yaml#/components/responses/Erro503
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
  /api/v1/autenticacao/login:
    post:
      operationId: criarLogin
      summary: Criar login
      description: §§7.1–7.3. JWT RS256 em memória; refresh somente em cookie Secure HttpOnly SameSite=Lax; 24 h
        sem lembrar, 30 dias com lembrar; access token até 15 min limitado à sessão.
      tags:
      - login
      security: []
      x-proposta: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginEntrada'
      responses:
        '200':
          description: Consulta ou alteração concluída (§6.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessao'
          headers:
            Set-Cookie:
              description: athenaRefresh=<opaco>; Path=/api/v1/autenticacao; Secure; HttpOnly; SameSite=Lax. Sem
                Domain. Max-Age só com lembrarDispositivo, limitado ao prazo restante.
              schema:
                type: string
                example: athenaRefresh=opaco; Path=/api/v1/autenticacao; Secure; HttpOnly; SameSite=Lax
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
        '429':
          $ref: ./_shared/components.yaml#/components/responses/Erro429
        '503':
          $ref: ./_shared/components.yaml#/components/responses/Erro503
        '401':
          $ref: ./_shared/components.yaml#/components/responses/Erro401
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
  /api/v1/autenticacao/recuperacao:
    post:
      operationId: criarRecuperacao
      summary: Criar recuperacao
      description: §§7.1–7.3. Resposta uniforme, não revela existência da conta. Location aponta para instruções
        de conclusão, sem identificador de conta.
      tags:
      - recuperacao
      security: []
      x-decidir: 'Recuperação: código 6 dígitos/10 min ou token de alta entropia/15 min? Não fixar formato de credencial.'
      x-proposta: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperacaoEntrada'
      responses:
        '202':
          description: Aceito; acompanhar Location; não indica conclusão (§6.2).
          headers:
            Location:
              description: URI das instruções, constante e independente da existência da conta.
              schema:
                type: string
                example: /api/v1/autenticacao/recuperacao/conclusao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecuperacaoAceita'
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
        '429':
          $ref: ./_shared/components.yaml#/components/responses/Erro429
        '503':
          $ref: ./_shared/components.yaml#/components/responses/Erro503
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
  /api/v1/autenticacao/recuperacao/conclusao:
    post:
      operationId: concluirRecuperacao
      summary: Concluir recuperacao
      description: §§7.1–7.3. Credencial opaca de uso único; redefinição encerra todas as sessões E autorizações
        MCP.
      tags:
      - conclusao
      security: []
      x-decidir: 'Recuperação: código 6 dígitos/10 min ou token de alta entropia/15 min? Não fixar formato de credencial.'
      x-proposta: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperacaoConclusao'
      responses:
        '204':
          description: Removido, sem corpo (§6.2).
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
        '429':
          $ref: ./_shared/components.yaml#/components/responses/Erro429
        '503':
          $ref: ./_shared/components.yaml#/components/responses/Erro503
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
  /api/v1/autenticacao/renovacao:
    post:
      operationId: renovarSessao
      summary: Renovar sessao
      description: §§7.2–7.3. Exige cookie + CSRF vinculado à sessão e Origin permitido. Rotação transacional, reuso
        revoga família; prazo absoluto não reinicia.
      tags:
      - renovacao
      x-papel-minimo: Leitor
      x-escopo-mcp: athena:read
      x-projeto: resolvido pelo recurso ou contexto autorizado; conta/workspace não concede papel em projeto
      security:
      - cookieRefresh: []
        csrf: []
      x-decidir: Confirmar nome X-CSRF-Token e mecanismo de entrega/renovação do token CSRF.
      x-proposta: true
      responses:
        '200':
          description: Consulta ou alteração concluída (§6.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessao'
          headers:
            Set-Cookie:
              description: Rotacionar refresh mantendo prazo absoluto.
              schema:
                type: string
                example: athenaRefresh=opaco; Path=/api/v1/autenticacao; Secure; HttpOnly; SameSite=Lax
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
        '401':
          $ref: ./_shared/components.yaml#/components/responses/Erro401
        '403':
          $ref: ./_shared/components.yaml#/components/responses/Erro403
        '404':
          $ref: ./_shared/components.yaml#/components/responses/Erro404
        '409':
          $ref: ./_shared/components.yaml#/components/responses/Erro409
        '429':
          $ref: ./_shared/components.yaml#/components/responses/Erro429
        '503':
          $ref: ./_shared/components.yaml#/components/responses/Erro503
      parameters:
      - name: Origin
        in: header
        required: true
        description: §7.3. Conferir origem HTTPS autorizada.
        schema:
          type: string
          example: https://athena.example.invalid
          format: uri
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
  /api/v1/autenticacao/logout:
    post:
      operationId: encerrarSessao
      summary: Encerrar sessao
      description: §§7.2–7.3. Exige cookie + CSRF vinculado à sessão e Origin permitido. Revoga só sessão atual,
        remove cookie com mesmo Path e limpa JWT. Autorização MCP permanece independente.
      tags:
      - logout
      x-papel-minimo: Leitor
      x-escopo-mcp: athena:read
      x-projeto: resolvido pelo recurso ou contexto autorizado; conta/workspace não concede papel em projeto
      security:
      - cookieRefresh: []
        csrf: []
      x-decidir: Confirmar nome X-CSRF-Token e mecanismo de entrega/renovação do token CSRF.
      x-proposta: true
      responses:
        '204':
          description: Removido, sem corpo (§6.2).
          headers:
            Set-Cookie:
              description: Excluir cookie com Path e atributos originais, Max-Age=0.
              schema:
                type: string
                example: athenaRefresh=; Path=/api/v1/autenticacao; Max-Age=0; Secure; HttpOnly; SameSite=Lax
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
        '401':
          $ref: ./_shared/components.yaml#/components/responses/Erro401
        '403':
          $ref: ./_shared/components.yaml#/components/responses/Erro403
        '404':
          $ref: ./_shared/components.yaml#/components/responses/Erro404
        '409':
          $ref: ./_shared/components.yaml#/components/responses/Erro409
        '429':
          $ref: ./_shared/components.yaml#/components/responses/Erro429
        '503':
          $ref: ./_shared/components.yaml#/components/responses/Erro503
      parameters:
      - name: Origin
        in: header
        required: true
        description: §7.3. Conferir origem HTTPS autorizada.
        schema:
          type: string
          example: https://athena.example.invalid
          format: uri
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
  /api/v1/usuarios/me:
    get:
      operationId: obterUsuarioAtual
      summary: Obter usuario atual
      description: Operação conforme §§5, 6.2–6.3 e 7.4. Revalidar acesso e estado no domínio proprietário.
      tags:
      - me
      x-papel-minimo: Leitor
      x-escopo-mcp: athena:read
      x-projeto: resolvido pelo recurso ou contexto autorizado; conta/workspace não concede papel em projeto
      responses:
        '200':
          description: Consulta ou alteração concluída (§6.2).
          headers:
            ETag:
              $ref: ./_shared/components.yaml#/components/headers/ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
        '401':
          $ref: ./_shared/components.yaml#/components/responses/Erro401
        '403':
          $ref: ./_shared/components.yaml#/components/responses/Erro403
        '404':
          $ref: ./_shared/components.yaml#/components/responses/Erro404
        '409':
          $ref: ./_shared/components.yaml#/components/responses/Erro409
        '429':
          $ref: ./_shared/components.yaml#/components/responses/Erro429
        '503':
          $ref: ./_shared/components.yaml#/components/responses/Erro503
      x-proposta: true
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
  /api/v1/autorizacoes-agente:
    get:
      operationId: listarAutorizacoesAgente
      summary: Listar autorizacoes agente
      description: Operação conforme §§5, 6.2–6.3 e 7.4. Revalidar acesso e estado no domínio proprietário.
      tags:
      - autorizacoes-agente
      x-papel-minimo: Leitor
      x-escopo-mcp: athena:read
      x-projeto: resolvido pelo recurso ou contexto autorizado; conta/workspace não concede papel em projeto
      parameters:
      - $ref: ./_shared/components.yaml#/components/parameters/Page
      - $ref: ./_shared/components.yaml#/components/parameters/Size
      - $ref: ./_shared/components.yaml#/components/parameters/Sort
      responses:
        '200':
          description: Consulta ou alteração concluída (§6.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaAutorizacoes'
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
        '401':
          $ref: ./_shared/components.yaml#/components/responses/Erro401
        '403':
          $ref: ./_shared/components.yaml#/components/responses/Erro403
        '404':
          $ref: ./_shared/components.yaml#/components/responses/Erro404
        '409':
          $ref: ./_shared/components.yaml#/components/responses/Erro409
        '429':
          $ref: ./_shared/components.yaml#/components/responses/Erro429
        '503':
          $ref: ./_shared/components.yaml#/components/responses/Erro503
      x-proposta: true
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
  /api/v1/autorizacoes-agente/{autorizacaoId}:
    delete:
      operationId: revogarAutorizacaoAgente
      summary: Revogar autorizacao agente
      description: §7.2. Apenas titular; encerra só autorização MCP, não sessão da interface; chamadas e entregas
        seguintes são bloqueadas.
      tags:
      - autorizacoes-agente
      x-papel-minimo: Leitor
      x-escopo-mcp: athena:admin
      x-projeto: resolvido pelo recurso ou contexto autorizado; conta/workspace não concede papel em projeto
      parameters:
      - name: autorizacaoId
        in: path
        required: true
        description: UUID do recurso (§5.1).
        schema:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      responses:
        '204':
          description: Removido, sem corpo (§6.2).
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
        '401':
          $ref: ./_shared/components.yaml#/components/responses/Erro401
        '403':
          $ref: ./_shared/components.yaml#/components/responses/Erro403
        '404':
          $ref: ./_shared/components.yaml#/components/responses/Erro404
        '409':
          $ref: ./_shared/components.yaml#/components/responses/Erro409
        '429':
          $ref: ./_shared/components.yaml#/components/responses/Erro429
        '503':
          $ref: ./_shared/components.yaml#/components/responses/Erro503
      x-proposta: true
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
  /api/v1/workspaces:
    get:
      operationId: listarWorkspaces
      summary: Listar workspaces
      description: Operação conforme §§5, 6.2–6.3 e 7.4. Revalidar acesso e estado no domínio proprietário.
      tags:
      - workspaces
      x-papel-minimo: Leitor
      x-escopo-mcp: athena:read
      x-projeto: resolvido pelo recurso ou contexto autorizado; conta/workspace não concede papel em projeto
      parameters:
      - $ref: ./_shared/components.yaml#/components/parameters/Page
      - $ref: ./_shared/components.yaml#/components/parameters/Size
      - $ref: ./_shared/components.yaml#/components/parameters/Sort
      responses:
        '200':
          description: Consulta ou alteração concluída (§6.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaWorkspaces'
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
        '401':
          $ref: ./_shared/components.yaml#/components/responses/Erro401
        '403':
          $ref: ./_shared/components.yaml#/components/responses/Erro403
        '404':
          $ref: ./_shared/components.yaml#/components/responses/Erro404
        '409':
          $ref: ./_shared/components.yaml#/components/responses/Erro409
        '429':
          $ref: ./_shared/components.yaml#/components/responses/Erro429
        '503':
          $ref: ./_shared/components.yaml#/components/responses/Erro503
      x-proposta: true
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
    post:
      operationId: criarWorkspace
      summary: Criar workspace
      description: §§5.6, 7.4. Criação de projeto torna criador único Owner. Propriedade de workspace não concede
        acesso implícito aos projetos. Política de criação no workspace pendente.
      tags:
      - workspaces
      x-papel-minimo: Leitor
      x-escopo-mcp: athena:admin
      x-projeto: resolvido pelo recurso ou contexto autorizado; conta/workspace não concede papel em projeto
      x-decidir: Quem pode criar workspace/projeto no workspace? Exige política própria; papel Leitor é piso, não
        concessão.
      x-proposta: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceEntrada'
      responses:
        '201':
          description: Criação síncrona (§6.2).
          headers:
            Location:
              $ref: ./_shared/components.yaml#/components/headers/Location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
        '401':
          $ref: ./_shared/components.yaml#/components/responses/Erro401
        '403':
          $ref: ./_shared/components.yaml#/components/responses/Erro403
        '404':
          $ref: ./_shared/components.yaml#/components/responses/Erro404
        '409':
          $ref: ./_shared/components.yaml#/components/responses/Erro409
        '429':
          $ref: ./_shared/components.yaml#/components/responses/Erro429
        '503':
          $ref: ./_shared/components.yaml#/components/responses/Erro503
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
  /api/v1/workspaces/{workspaceId}:
    get:
      operationId: obterWorkspace
      summary: Obter workspace
      description: Operação conforme §§5, 6.2–6.3 e 7.4. Revalidar acesso e estado no domínio proprietário.
      tags:
      - workspaces
      x-papel-minimo: Leitor
      x-escopo-mcp: athena:read
      x-projeto: resolvido pelo recurso ou contexto autorizado; conta/workspace não concede papel em projeto
      parameters:
      - name: workspaceId
        in: path
        required: true
        description: UUID do recurso (§5.1).
        schema:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      responses:
        '200':
          description: Consulta ou alteração concluída (§6.2).
          headers:
            ETag:
              $ref: ./_shared/components.yaml#/components/headers/ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
        '401':
          $ref: ./_shared/components.yaml#/components/responses/Erro401
        '403':
          $ref: ./_shared/components.yaml#/components/responses/Erro403
        '404':
          $ref: ./_shared/components.yaml#/components/responses/Erro404
        '409':
          $ref: ./_shared/components.yaml#/components/responses/Erro409
        '429':
          $ref: ./_shared/components.yaml#/components/responses/Erro429
        '503':
          $ref: ./_shared/components.yaml#/components/responses/Erro503
      x-proposta: true
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de
        negócio seguem o livro e lacunas usam x-decidir.
    patch:
      operationId: editarWorkspace
      summary: Editar workspace
      description: Operação conforme §§5, 6.2–6.3 e 7.4. Revalidar acesso e estado no domínio proprietário.
      tags:
      - workspaces
      x-papel-minimo: Owner
      x-escopo-mcp: athena:admin
      x-projeto: resolvido pelo recurso ou contexto autorizado; conta/workspace não concede papel em projeto
      x-decidir: Qual permissão de organização para workspace, cuja propriedade é independente dos projetos?
      parameters:
      - name: workspaceId
        in: path
        required: true
        description: UUID do recurso (§5.1).
        schema:
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspacePatch'
      responses:
        '200':
          description: Consulta ou alteração concluída (§6.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: ./_shared/components.yaml#/components/responses/Erro400
