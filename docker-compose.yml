# ATHENA — ambiente local completo.
#
#   docker compose up --build
#
# Redes (isolamento entre camadas):
#   edge      navegador -> frontends e Gateway. Única rede com portas publicadas.
#   app       Gateway, BFFs, serviços de domínio e RabbitMQ. Sem acesso externo.
#   dados-*   uma por serviço: só o serviço dono enxerga o seu banco.
#
# As variáveis têm valores padrão de desenvolvimento, então o comando acima
# funciona sem preparo. Para trocar senhas ou portas, copie .env.example para .env.

name: athena-sd

x-banco: &banco
  image: athena/postgres:17.9-1
  build:
    context: ./infra/postgres
  restart: unless-stopped

x-java: &java
  restart: unless-stopped
  mem_limit: 512m

x-rabbitmq-cliente: &rabbitmq-cliente
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: ${RABBITMQ_USER:-athena}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dev_rabbitmq}

services:

  # ---------------------------------------------------------------- mensageria

  rabbitmq:
    image: athena/rabbitmq:4.3.7-1
    build:
      context: ./infra/rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-athena}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dev_rabbitmq}
    volumes:
      - rabbitmq-dados:/var/lib/rabbitmq
    networks:
      - app

  # Caixa de e-mails de desenvolvimento: http://localhost:8025. Em produção, use SMTP real.
  # Publicada só no localhost: a caixa mostra códigos de recuperação de qualquer conta.
  mailpit:
    image: axllent/mailpit:v1.20.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks:
      - app
      - edge

  # ---------------------------------------------------------------- clientes
  # nginx servindo o Angular. Encaminha /api ao Gateway: o navegador vê uma só origem.

  frontend-gestao:
    image: athena/frontend-gestao:0.3.0
    build:
      context: ./frontend/gestao
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://gateway:8080
    ports:
      - "${FRONTEND_GESTAO_PORT:-4200}:8080"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - edge

  frontend-livro:
    image: athena/frontend-livro:0.3.0
    build:
      context: ./frontend/livro
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://gateway:8080
    ports:
      - "${FRONTEND_LIVRO_PORT:-4300}:8080"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - edge

  # ------------------------------------------------------------------- borda
  # O Gateway é a única entrada HTTP da aplicação e a única ponte entre a rede
  # "edge" e a rede "app".

  gateway:
    <<: *java
    image: athena/gateway:0.3.0
    build:
      context: ./gateway
    environment:
      BFF_GESTAO_URL: http://bff-gestao:8080
      BFF_LIVRO_URL: http://bff-livro:8080
      IMPACTO_MCP_URL: http://impacto-mcp:8000
      PROJETOS_ACESSO_URL: http://projetos-acesso:8080
      # Os clientes ficam em outras portas; o nginx deles repassa /api ao Gateway.
      ATHENA_ORIGENS_PERMITIDAS: http://localhost:${FRONTEND_GESTAO_PORT:-4200},http://localhost:${FRONTEND_LIVRO_PORT:-4300}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      projetos-acesso:
        condition: service_healthy
      bff-gestao:
        condition: service_healthy
      bff-livro:
        condition: service_healthy
      impacto-mcp:
        condition: service_healthy
    networks:
      - edge
      - app

  # -------------------------------------------------------------------- BFFs
  # Sem banco e sem estado: podem ter várias réplicas.

  bff-gestao:
    <<: *java
    image: athena/bff-gestao:0.3.0
    build:
      context: ./bff/gestao
    environment:
      PROJETOS_ACESSO_URL: http://projetos-acesso:8080
      REQUISITOS_URL: http://requisitos:8080
      REVISOES_URL: http://revisoes:8080
      RASTREABILIDADE_URL: http://rastreabilidade:8080
    depends_on:
      requisitos:
        condition: service_healthy
    networks:
      - app

  bff-livro:
    <<: *java
    image: athena/bff-livro:0.3.0
    build:
      context: ./bff/livro
    environment:
      PROJETOS_ACESSO_URL: http://projetos-acesso:8080
      REQUISITOS_URL: http://requisitos:8080
      RASTREABILIDADE_URL: http://rastreabilidade:8080
    depends_on:
      requisitos:
        condition: service_healthy
    networks:
      - app

  # ------------------------------------------------------- serviços de domínio
  # Nenhum publica porta: só são alcançáveis pela rede "app".

  projetos-acesso:
    <<: *java
    image: athena/projetos-acesso:0.3.0
    build:
      context: ./services/projetos-acesso
    environment:
      <<: *rabbitmq-cliente
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      ATHENA_USUARIOS_DEMO: "true"
      # HTTP local; em produção o cookie deve usar Secure.
      ATHENA_COOKIE_SEGURO: "false"
      DB_HOST: db-projetos-acesso
      DB_NAME: projetos_acesso
      DB_USER: ${PROJETOS_ACESSO_DB_USER:-projetos_acesso}
      DB_PASSWORD: ${PROJETOS_ACESSO_DB_PASSWORD:-dev_projetos_acesso}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/demo}
    depends_on:
      db-projetos-acesso:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app
      - dados-projetos-acesso

  requisitos:
    <<: *java
    image: athena/requisitos:0.3.0
    build:
      context: ./services/requisitos
    environment:
      <<: *rabbitmq-cliente
      DB_HOST: db-requisitos
      DB_NAME: requisitos
      DB_USER: ${REQUISITOS_DB_USER:-requisitos}
      DB_PASSWORD: ${REQUISITOS_DB_PASSWORD:-dev_requisitos}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/demo}
    depends_on:
      db-requisitos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app
      - dados-requisitos

  rastreabilidade:
    <<: *java
    image: athena/rastreabilidade:0.3.0
    build:
      context: ./services/rastreabilidade
    environment:
      <<: *rabbitmq-cliente
      REQUISITOS_URL: http://requisitos:8080
      DB_HOST: db-rastreabilidade
      DB_NAME: rastreabilidade
      DB_USER: ${RASTREABILIDADE_DB_USER:-rastreabilidade}
      DB_PASSWORD: ${RASTREABILIDADE_DB_PASSWORD:-dev_rastreabilidade}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/demo}
    depends_on:
      db-rastreabilidade:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app
      - dados-rastreabilidade

  revisoes:
    <<: *java
    image: athena/revisoes:0.3.0
    build:
      context: ./services/revisoes
    environment:
      <<: *rabbitmq-cliente
      DB_HOST: db-revisoes
      DB_NAME: revisoes
      DB_USER: ${REVISOES_DB_USER:-revisoes}
      DB_PASSWORD: ${REVISOES_DB_PASSWORD:-dev_revisoes}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/demo}
    depends_on:
      db-revisoes:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app
      - dados-revisoes

  integracoes:
    <<: *java
    image: athena/integracoes:0.3.0
    build:
      context: ./services/integracoes
    environment:
      <<: *rabbitmq-cliente
      DB_HOST: db-integracoes
      DB_NAME: integracoes
      DB_USER: ${INTEGRACOES_DB_USER:-integracoes}
      DB_PASSWORD: ${INTEGRACOES_DB_PASSWORD:-dev_integracoes}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/demo}
    depends_on:
      db-integracoes:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app
      - dados-integracoes

  impacto-mcp:
    image: athena/impacto-mcp:0.3.0
    build:
      context: ./services/impacto-mcp
    restart: unless-stopped
    mem_limit: 1g
    environment:
      <<: *rabbitmq-cliente
      DB_HOST: db-impacto-mcp
      DB_NAME: impacto_mcp
      DB_USER: ${IMPACTO_MCP_DB_USER:-impacto_mcp}
      DB_PASSWORD: ${IMPACTO_MCP_DB_PASSWORD:-dev_impacto_mcp}
      CARREGAR_DEMO: ${CARREGAR_DEMO:-true}
    depends_on:
      db-impacto-mcp:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app
      - dados-impacto-mcp

  # -------------------------------------------- bancos (um por serviço de domínio)

  db-projetos-acesso:
    <<: *banco
    environment:
      POSTGRES_DB: projetos_acesso
      POSTGRES_USER: ${PROJETOS_ACESSO_DB_USER:-projetos_acesso}
      POSTGRES_PASSWORD: ${PROJETOS_ACESSO_DB_PASSWORD:-dev_projetos_acesso}
    volumes:
      - db-projetos-acesso-dados:/var/lib/postgresql/data
    networks:
      - dados-projetos-acesso

  db-requisitos:
    <<: *banco
    environment:
      POSTGRES_DB: requisitos
      POSTGRES_USER: ${REQUISITOS_DB_USER:-requisitos}
      POSTGRES_PASSWORD: ${REQUISITOS_DB_PASSWORD:-dev_requisitos}
    volumes:
      - db-requisitos-dados:/var/lib/postgresql/data
    networks:
      - dados-requisitos

  db-rastreabilidade:
    <<: *banco
    environment:
      POSTGRES_DB: rastreabilidade
      POSTGRES_USER: ${RASTREABILIDADE_DB_USER:-rastreabilidade}
      POSTGRES_PASSWORD: ${RASTREABILIDADE_DB_PASSWORD:-dev_rastreabilidade}
    volumes:
      - db-rastreabilidade-dados:/var/lib/postgresql/data
    networks:
      - dados-rastreabilidade

  db-revisoes:
    <<: *banco
    environment:
      POSTGRES_DB: revisoes
      POSTGRES_USER: ${REVISOES_DB_USER:-revisoes}
      POSTGRES_PASSWORD: ${REVISOES_DB_PASSWORD:-dev_revisoes}
    volumes:
      - db-revisoes-dados:/var/lib/postgresql/data
    networks:
      - dados-revisoes

  db-integracoes:
    <<: *banco
    environment:
      POSTGRES_DB: integracoes
      POSTGRES_USER: ${INTEGRACOES_DB_USER:-integracoes}
      POSTGRES_PASSWORD: ${INTEGRACOES_DB_PASSWORD:-dev_integracoes}
    volumes:
      - db-integracoes-dados:/var/lib/postgresql/data
    networks:
      - dados-integracoes

  # Mesmo Dockerfile dos demais bancos, com a base que traz a extensão pgvector.
  db-impacto-mcp:
    image: athena/postgres-pgvector:0.8.7-pg17-1
    build:
      context: ./infra/postgres
      args:
        IMAGEM_BASE: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: impacto_mcp
      POSTGRES_USER: ${IMPACTO_MCP_DB_USER:-impacto_mcp}
      POSTGRES_PASSWORD: ${IMPACTO_MCP_DB_PASSWORD:-dev_impacto_mcp}
    volumes:
      - db-impacto-mcp-dados:/var/lib/postgresql/data
    networks:
      - dados-impacto-mcp

networks:
  edge:
  app:
    internal: true
  dados-projetos-acesso:
    internal: true
  dados-requisitos:
    internal: true
  dados-rastreabilidade:
    internal: true
  dados-revisoes:
    internal: true
  dados-integracoes:
    internal: true
  dados-impacto-mcp:
    internal: true

volumes:
  rabbitmq-dados:
  db-projetos-acesso-dados:
  db-requisitos-dados:
  db-rastreabilidade-dados:
  db-revisoes-dados:
  db-integracoes-dados:
  db-impacto-mcp-dados:
