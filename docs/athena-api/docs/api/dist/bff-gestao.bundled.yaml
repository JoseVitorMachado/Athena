paths:
  /api/v1/gestao/projetos/{projetoId}/requisitos:
    get:
      operationId: gestaoListarRequisitos
      summary: Listar requisitos
      description: 'Operação conforme §§5, 6.2–6.3 e 7.4. Revalidar acesso e estado no domínio proprietário. BFF Gestão (§4.2): consulta requisitos por troca de token, sem banco próprio; se domínio ou validação em Projetos e acesso falhar, retorna 503; não repete escrita automaticamente. Encaminha ETag, If-Match e Idempotency-Key. Location/_links externos usam /api/v1/gestao, sem revelar endereço interno.'
      tags:
        - requisitos
      x-papel-minimo: Leitor
      x-escopo-mcp: athena:read
      x-projeto: projetoId
      x-decidir: Qual catálogo de tipos de requisito?
      parameters:
        - $ref: '#/components/parameters/ProjetoId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: q
          in: query
          description: Filtro autorizado (§6.2); valor inválido retorna 400.
          schema:
            type: string
            example: exportar
        - name: situacao
          in: query
          description: Filtro autorizado (§6.2); valor inválido retorna 400.
          schema:
            $ref: '#/components/schemas/SituacaoRequisito'
            default: ATIVO
        - name: estadoVersao
          in: query
          description: Filtro autorizado (§6.2); valor inválido retorna 400.
          schema:
            $ref: '#/components/schemas/EstadoVersao'
        - name: tipo
          in: query
          description: Filtro autorizado (§6.2); valor inválido retorna 400.
          schema:
            type: string
            example: FUNCIONAL
        - name: epicoId
          in: query
          description: Filtro autorizado (§6.2); valor inválido retorna 400.
          schema:
            type: string
            example: 11111111-1111-4111-8111-111111111111
            format: uuid
        - name: responsavelId
          in: query
          description: Filtro autorizado (§6.2); valor inválido retorna 400.
          schema:
            type: string
            example: 11111111-1111-4111-8111-111111111111
            format: uuid
      responses:
        '200':
          description: Consulta ou alteração concluída (§6.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaRequisitos'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
        '429':
          $ref: '#/components/responses/Erro429'
        '503':
          $ref: '#/components/responses/Erro503'
      security:
        - bearerJwt: []
      x-proposta: true
      x-motivo-proposta: Representação de payload/nomes e enum de ordenação autorados contract-first; regras de negócio seguem o livro e lacunas usam x-decidir.
    post:
      operationId: gestaoCriarRequisito
      summary: Criar requisito
      description: 'Operação conforme §§5, 6.2–6.3 e 7.4. Revalidar acesso e estado no domínio proprietário. BFF Gestão (§4.2): consulta requisitos por troca de token, sem banco próprio; se domínio ou validação em Projetos e acesso falhar, retorna 503; não repete escrita automaticamente. Encaminha ETag, If-Match e Idempotency-Key. Location/_links externos usam /api/v1/gestao, sem revelar endereço interno.'
      tags:
