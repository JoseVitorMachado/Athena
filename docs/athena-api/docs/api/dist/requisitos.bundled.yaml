openapi: 3.1.0
info:
  title: ATHENA — Requisitos
  version: 1.0.0
  description: 'Versionamento por URI (§6.2): /api/v1 para mudanças compatíveis, /api/v2 para quebra. Gateway roteia por prefixo; versão aparece nos logs; clientes Angular migram sem negociar cabeçalho. Versão da API independe da versão do requisito. Fonte de verdade: Arquitetura v1.0, §§4, 5.1–5.3, 6.2–6.9 e 7.4–7.5. APIs de domínio são internas; só BFFs, MCP e serviços com troca de token as chamam. Nenhuma leitura é pública por compartilhar URL. Escopos x-escopo-mcp só são exigidos em contexto delegado; nunca substituem papel/acesso. x-proposta identifica formas de representação não especificadas pelo livro.'
  contact:
    name: Equipe ATHENA
servers:
  - url: https://athena.example.invalid
    description: Origem HTTPS ilustrativa; substituir no ambiente.
security:
  - serviceToken: []
tags:
  - name: documentos
    description: Recursos documentos; §§5–7.
  - name: epicos
    description: Recursos epicos; §§5–7.
  - name: requisitos
    description: Recursos requisitos; §§5–7.
  - name: candidata
    description: Recursos candidata; §§5–7.
  - name: versoes
    description: Recursos versoes; §§5–7.
  - name: submissoes
    description: Recursos submissoes; §§5–7.
  - name: publicacoes
    description: Recursos publicacoes; §§5–7.
  - name: historico
    description: Recursos historico; §§5–7.
  - name: cancelamentos
    description: Recursos cancelamentos; §§5–7.
  - name: reativacoes
    description: Recursos reativacoes; §§5–7.
  - name: comentarios
    description: Recursos comentarios; §§5–7.
  - name: baselines
    description: Recursos baselines; §§5–7.
  - name: confirmacoes-publicacao
    description: Recursos confirmacoes-publicacao; §§5–7.
