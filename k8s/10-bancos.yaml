# Seis instâncias PostgreSQL independentes, uma por serviço de domínio
# (livro de arquitetura §3.2 e §8.2). O impacto-mcp usa a imagem com pgvector.
---
# Banco exclusivo do serviço projetos-acesso: Service headless + StatefulSet com volume próprio.
apiVersion: v1
kind: Service
metadata:
  name: db-projetos-acesso
  namespace: athena
  labels:
    app.kubernetes.io/name: db-projetos-acesso
    app.kubernetes.io/part-of: athena
    athena/camada: dados
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: db-projetos-acesso
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-projetos-acesso
  namespace: athena
  labels:
    app.kubernetes.io/name: db-projetos-acesso
    app.kubernetes.io/part-of: athena
    athena/camada: dados
spec:
  serviceName: db-projetos-acesso
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db-projetos-acesso
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-projetos-acesso
        app.kubernetes.io/part-of: athena
        athena/camada: dados
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: athena/postgres:17.9-1
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: athena-config
                  key: PROJETOS_ACESSO_DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-projetos-acesso-credenciais
                  key: usuario
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-projetos-acesso-credenciais
                  key: senha
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: dados
              mountPath: /var/lib/postgresql/data
  # Um PersistentVolumeClaim por réplica, mantido mesmo se o StatefulSet for apagado.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: dados
        labels:
          app.kubernetes.io/name: db-projetos-acesso
          app.kubernetes.io/part-of: athena
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
