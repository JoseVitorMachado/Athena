openapi: 3.1.0
info:
  title: ATHENA — BFF Gestão
  version: 1.0.0
  description: 'Versionamento por URI (§6.2): /api/v1 para mudanças compatíveis, /api/v2 para quebra. Gateway roteia por prefixo; versão aparece nos logs; clientes Angular migram sem negociar cabeçalho. Versão da API independe da versão do requisito. Fonte de verdade: Arquitetura v1.0, §§4.1–4.2, 6.1–6.4 e 7.4. APIs de domínio são internas; só BFFs, MCP e serviços com troca de token as chamam. Nenhuma leitura é pública por compartilhar URL. Escopos x-escopo-mcp só são exigidos em contexto delegado; nunca substituem papel/acesso. x-proposta identifica formas de representação não especificadas pelo livro.'
  contact:
    name: Equipe ATHENA
servers:
  - url: https://athena.example.invalid
    description: Origem HTTPS ilustrativa; substituir no ambiente.
security:
  - bearerJwt: []
tags:
  - name: requisitos
    description: Repasse de requisitos
  - name: candidata
    description: Repasse de requisitos
