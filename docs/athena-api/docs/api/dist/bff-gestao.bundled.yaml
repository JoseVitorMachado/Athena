    post:
      operationId: gestaoCriarSubmissao
      summary: Criar submissao
      description: '§§5.2, 6.3, 6.5–6.9. If-Match da candidata. Apenas RASCUNHO; submissão ativa ou estado divergente retorna 409. 202 após transação local; SAGA independe da IA, conclui ao preparar revisão. Ativação do lote é posterior. Prazo inicial 90 s; compensação confirmada antes de liberar candidata. BFF Gestão (§4.2): consulta requisitos por troca de token, sem banco próprio; se domínio ou validação em Projetos e acesso falhar, retorna 503; não repete escrita automaticamente. Encaminha ETag, If-Match e Idempotency-Key. Location/_links externos usam /api/v1/gestao, sem revelar endereço interno.'
